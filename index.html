      'Tổng số đáp án không khớp với cấu trúc của phiếu nào (Phần II mỗi câu 4 ý; Phần I tối đa ' +
        Math.max(SHEET_NH.MAX1, SHEET_KT.MAX1, SHEET_M.MAX1) +
        ' câu).'
    ]
  };
  function qrFromText(text, fromPaste) {
    const r = parseQrKey(text);
    if (r.error) {
      const m = QR_ERR[r.error] || QR_ERR.shape;
      qrState = { kind: 'error', title: m[0], body: m[1] };
    } else {
      qrState = { kind: 'preview', res: r };
      applyQr();
      return;
    }
    renderQr();
    if (fromPaste) {
      const d = $('#qrCard .qrpaste');
      if (d) d.open = true;
    }
  }
  async function qrFromFile(file) {
    qrState = { kind: 'busy' };
    renderQr();
    await nextFrame();
    try {
      const cv = await fileToCanvas(file, 2400);
      const text = await decodeQrCanvas(cv);
      if (!text) {
        qrState = { kind: 'error', title: QR_ERR.nocode[0], body: QR_ERR.nocode[1] };
        renderQr();
        return;
      }
      qrFromText(text, false);
    } catch (e) {
      qrState = {
        kind: 'error',
        title: 'Không mở được ảnh này.',
        body: 'Thử chụp lại hoặc chọn ảnh JPG hoặc PNG khác.'
      };
      renderQr();
    }
  }
  function isBlankVer(v) {
    return (
      !v.code &&
      v.mcq.every(function (x) {
        return x == null;
      }) &&
      v.tf.every(function (r) {
        return r.every(function (x) {
          return x == null;
        });
      }) &&
      v.num.every(function (x) {
        return !x;
      })
    );
  }
  function isUntouchedDefault() {
    if (cfg.versions.length !== 1) return false;
    if (isBlankVer(cfg.versions[0])) return true;
    try {
      const v = JSON.parse(JSON.stringify(cfg.versions[0])),
        d = defaultCfg().versions[0];
      if (d.code.indexOf(v.code) === 0) v.code = d.code;
      return JSON.stringify(v) === JSON.stringify(d);
    } catch (e) {
      return false;
    }
  }
  function applyQr() {
    const r = qrState.res;
    if (!r) return;
    qrUndo = JSON.parse(JSON.stringify(cfg));
    if (r.sheet && r.sheet !== cfg.sheet) switchSheet(r.sheet);
    cfg.n1 = r.n1;
    cfg.n2 = r.n2;
    cfg.n3 = r.n3;
    const pr = presetsNow().find(function (p) {
      return p.n1 === r.n1 && p.n2 === r.n2 && p.n3 === r.n3;
    });
    if (pr) {
      cfg.p1 = pr.p1;
      cfg.p2 = pr.p2;
      cfg.p3 = pr.p3;
    }
    let added = 0,
      updated = 0,
      first = -1;
    if (isUntouchedDefault()) {
      cfg.versions = r.versions.slice(0, 20);
      added = cfg.versions.length;
      first = 0;
    } else {
      r.versions.forEach(function (nv) {
        const k = nv.code
          ? cfg.versions.findIndex(function (v) {
              return v.code === nv.code;
            })
          : -1;
        if (k >= 0) {
          cfg.versions[k] = nv;
          updated++;
          if (first < 0) first = k;
        } else if (cfg.versions.length < 20) {
          cfg.versions.push(nv);
          added++;
          if (first < 0) first = cfg.versions.length - 1;
        }
      });
    }
    cfg.active = Math.max(0, first);
    qrState = {
      kind: 'done',
      warns: r.warnings,
      text:
        (added ? 'Thêm ' + added + ' mã đề mới' : '') +
        (added && updated ? ', ' : '') +
        (updated ? 'cập nhật ' + updated + ' mã đề trùng' : '') +
        '. Hiện có ' +
        cfg.versions.length +
        ' mã đề: ' +
        cfg.versions
          .map(function (v) {
            return v.code || '—';
          })
          .join(' · ') +
        '. Cấu trúc ' +
        r.n1 +
        ' · ' +
        r.n2 +
        ' · ' +
        r.n3 +
        ' câu.'
    };
    saveCfg();
    scan = null;
    renderScan();
    renderChip();
    renderKey();
  }
  function undoQr() {
    if (!qrUndo) return;
    const c = sanitizeCfg(qrUndo);
    qrUndo = null;
    if (c) {
      cfg = c;
      setSheet(cfg.sheet || 'nh');
      renderSheetSel();
    }
    qrState = { kind: 'idle' };
    saveCfg();
    scan = null;
    renderScan();
    renderChip();
    renderKey();
  }

  /* ---------- Khởi động ---------- */
  renderSheetSel();
  renderChip();
  renderScan();
  const first = function () {
    if (!scan)
      runPhoto(function () {
        return makeSample().then(function (s) {
          return s.canvas;
        });
      }, 'sample');
  };
  if (document.fonts && document.fonts.ready)
    document.fonts.ready.then(function () {
      setTimeout(first, 30);
    });
  else setTimeout(first, 200);
  // --- KẾT NỐI TÍNH NĂNG MỞ RỘNG CỦA NTMIX ---
  function getStudentInfo(sbd) {
      const stds = LS.get('omr.students', {});
      return stds[String(sbd).trim()] || null;
  }

  // Chèn tên học sinh vào màn hình Camera
  const oldLvShowScore = lvShowScore;
  lvShowScore = function(rd) {
      oldLvShowScore(rd);
      if (rd && rd.scan) {
          const info = getStudentInfo(rd.scan.sbdStr);
          if (info) {
              const e = $('#lvScore');
              if (e) e.innerHTML = e.innerHTML.replace('SBD ' + rd.scan.sbdStr, 'SBD ' + rd.scan.sbdStr + ' - <span style="color:#3ddc84">' + esc(info.name) + '</span>');
          }
      }
  };

  // Chèn tên học sinh vào Dải thông tin in trên ảnh lưu
  const oldWithBanner = withBanner;
  withBanner = function(cvs, sbd, md, g) {
      const info = getStudentInfo(sbd);
      const stuStr = info ? ' - ' + info.name : '';
      const bh = Math.max(34, Math.round(cvs.width * 0.06)), out = document.createElement('canvas');
      out.width = cvs.width; out.height = cvs.height + bh; const c = out.getContext('2d');
      c.fillStyle = '#111'; c.fillRect(0, 0, out.width, bh); c.drawImage(cvs, 0, bh);
      c.fillStyle = '#fff'; c.font = '600 ' + Math.round(bh * 0.5) + 'px sans-serif'; c.textBaseline = 'middle';
      c.fillText('SBD ' + (sbd || '—') + stuStr + '  ·  Mã đề ' + (md || '—') + '  ·  Điểm ' + fmt(g.total) + '/' + fmt(g.max), 12, bh / 2);
      return out;
  };

  // Nâng cấp xuất Excel thay vì CSV
  exportCsv = async function() {
      const rows = [['Thời gian', 'Số báo danh', 'Họ và tên', 'Lớp', 'Mã đề', 'Phần I', 'Phần II', 'Phần III', 'Tổng điểm', 'Điểm tối đa']];
      listRes().slice().reverse().forEach(function (r) {
          const p = r.parts || ['', '', ''];
          const info = getStudentInfo(r.sbd) || {name: '', cls: ''};
          rows.push([new Date(r.t).toLocaleString('vi-VN'), r.sbd, info.name, info.cls, r.md, p[0], p[1], p[2], r.total, r.max]);
      });
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "BangDiem");
      XLSX.writeFile(wb, `BangDiem_NTMIX_${Date.now()}.xlsx`);
      const msg = $('#resMsg'); if (msg) msg.textContent = 'Đã tải bảng điểm Excel.';
  };

  // Xử lý nạp DSHS (.xlsx)
  setTimeout(() => {
      const spScan = $('#studentPickScan');
      if (spScan) spScan.onchange = function() {
          const f = this.files[0]; this.value = ''; if (!f) return; const r = new FileReader();
          r.onload = e => {
              try {
                  const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                  let students = LS.get('omr.students', {}); let added = 0;
                  rows.forEach(row => {
                      let sbd = row['SBD'] || row['Số báo danh'] || row['sbd'] || row['Mã học sinh'];
                      let name = row['HỌ VÀ TÊN'] || row['Họ và tên'] || row['Họ tên'] || row['Tên'];
                      let cls = row['Lớp'] || row['LỚP'] || row['Class'] || '';
                      if (sbd && name) { students[String(sbd).trim()] = { name: String(name).trim(), cls: String(cls).trim() }; added++; }
                  });
                  LS.set('omr.students', students); alert(`✅ Đã cập nhật ${added} học sinh!`);
                  if ($('#v-res') && !$('#v-res').hidden) renderRes();
              } catch(err) { alert("Lỗi file Excel!"); }
          };
          r.readAsArrayBuffer(f);
      };

      // Xử lý nạp Đáp án Excel
      const epk = $('#excelPickKey');
      if (epk) epk.onchange = function() {
          const f = this.files[0]; this.value = ''; if (!f) return; const r = new FileReader();
          r.onload = e => {
              try {
                  const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
                  let added = 0; let header = rows[0];
                  for (let c = 1; c < header.length; c++) {
                      let code = String(header[c]).trim().replace(/\D/g, ''); if (!code) continue;
                      let v = emptyVer(code); let p = 1, q1 = 0, q2 = 0, q3 = 0, lastQ = 0;
                      for (let i = 1; i < rows.length; i++) {
                          let qNum = parseInt(rows[i][0]); if (isNaN(qNum)) continue;
                          if (qNum <= lastQ && qNum === 1) p++; lastQ = qNum;
                          let val = String(rows[i][c]).trim().toUpperCase();
                          if (p === 1 && q1 < cfg.n1) { v.mcq[q1++] = ['A','B','C','D'].includes(val) ? ['A','B','C','D'].indexOf(val) : null; }
                          else if (p === 2 && q2 < cfg.n2) {
                              let tf = (val.replace(/Đ/g,'D').replace(/[^DS]/g,'') + '----').slice(0,4);
                              for(let j=0; j<4; j++) v.tf[q2][j] = ['D','S'].includes(tf[j]) ? tf[j] : null; q2++;
                          } else if (p === 3 && q3 < cfg.n3) { v.num[q3++] = val.replace(/\./g, ','); }
                      }
                      const existing = cfg.versions.findIndex(x => x.code === code);
                      if (existing >= 0) cfg.versions[existing] = v; else cfg.versions.push(v); added++;
                  }
                  if (added) {
                      if (cfg.versions.length > 1 && !cfg.versions[0].code) cfg.versions.shift();
                      saveCfg(); renderKey(); alert(`✅ Đã nạp thành công ${added} mã đề từ Excel.`);
                  }
              } catch(err) { alert("Lỗi nạp Excel!"); }
          };
          r.readAsArrayBuffer(f);
      };

      // Xóa đáp án
      const qrClear = $('#qrClearAll');
      if (qrClear) qrClear.onclick = function() {
          if (confirm("Chắc chắn xóa toàn bộ mã đề đã nạp?")) {
              cfg.versions = [emptyVer('')]; cfg.active = 0; saveCfg(); renderKey();
              alert('✅ Đã xóa toàn bộ mã đề.');
          }
      };
  }, 1000);

  // Hook Nút Tải ZIP
  const oldRenderRes = renderRes;
  renderRes = function() {
      oldRenderRes();
      const zBtn = $('#zipBtn');
      if (zBtn) zBtn.onclick = async function() {
          const view = listRes().slice().reverse(); if (!view.length) return;
          this.textContent = "⏳ Đang tạo ZIP..."; this.disabled = true;
          try {
              let zip = new JSZip(); let folder = zip.folder("BaiCham_NTMIX");
              for (let i=0; i<view.length; i++) {
                  let r = view[i]; let blob = await IMG.get(r.id);
                  if (blob) { let stu = getStudentInfo(r.sbd); let sName = stu && stu.name ? `_${stu.name}` : ""; folder.file(`${r.sbd}_${r.md}${sName}.jpg`, blob); }
              }
              let content = await zip.generateAsync({type:"blob"}); saveAs(content, `AnhCham_NTMIX_${Date.now()}.zip`);
          } catch(e) { alert("Lỗi tạo ZIP"); }
          this.textContent = "📦 Tải ZIP Ảnh"; this.disabled = false;
      };
  };

  window.__omr = {
    makeSample: makeSample,
    analyze: analyze,
    getScan: function () {
      return scan;
    },
    cfg: function () {
      return cfg;
    },
    grade: function () {
      return scan && !scan.error ? grade() : null;
    },
    renderPhoto: function (marks, o) {
      return curSheetImg().then(function (img) {
        return renderPhoto(img, cfg, marks, o);
      });
    },
    setSheet: function (id) {
      return switchSheet(id);
    },
    SHEET: function () {
      return SHEET;
    },
    buildMarks: function () {
      return buildMarks(curVer());
    },
    parseQrKey: parseQrKey,
    decodeQrCanvas: decodeQrCanvas,
    startLive: startLive,
    lvStop: lvStop,
    LV: LV,
    SND: SND
  };
})();
// --- BỔ SUNG TÍNH NĂNG TẢI ZIP ẢNH & XUẤT EXCEL CHO NTMIX ---
  setTimeout(function() {
      // 1. Tự động chèn nút Tải ZIP vào cạnh nút Tải CSV
      const csvBtn = document.getElementById('csvBtn');
      if (csvBtn && !document.getElementById('zipBtn')) {
          const zipBtn = document.createElement('button');
          zipBtn.type = 'button';
          zipBtn.className = 'btn warning';
          zipBtn.id = 'zipBtn';
          zipBtn.innerHTML = '📦 Tải ZIP Ảnh';
          csvBtn.parentNode.insertBefore(zipBtn, csvBtn.nextSibling);

          zipBtn.onclick = async function() {
              const view = listRes().slice().reverse(); 
              if (!view.length) {
                  alert("Chưa có ảnh bài nào được chấm để tải!");
                  return;
              }
              this.innerHTML = "⏳ Đang nén ZIP..."; 
              this.disabled = true;
              try {
                  let zip = new JSZip(); 
                  let folder = zip.folder("BaiCham_NTMIX");
                  for (let i = 0; i < view.length; i++) {
                      let r = view[i]; 
                      let blob = await IMG.get(r.id);
                      if (blob) { 
                          let stu = getStudentInfo(r.sbd); 
                          let sName = stu && stu.name ? `_${stu.name}` : ""; 
                          folder.file(`${r.sbd}_${r.md}${sName}.jpg`, blob); 
                      }
                  }
                  let content = await zip.generateAsync({type: "blob"}); 
                  saveAs(content, `AnhCham_NTMIX_${Date.now()}.zip`);
              } catch(e) { 
                  alert("Lỗi tạo file ZIP ảnh: " + e.message); 
              }
              this.innerHTML = "📦 Tải ZIP Ảnh"; 
              this.disabled = false;
          };
      }

      // 2. Ghi đè chức năng của nút tải CSV thành Xuất File Excel (.xlsx) chuẩn
      if (csvBtn) {
          csvBtn.innerHTML = '📥 Xuất Excel Điểm';
          csvBtn.onclick = function() {
              const view = listRes().slice().reverse();
              if (!view.length) {
                  alert("Chưa có bài nào để xuất điểm!");
                  return;
              }
              const rows = [['STT', 'Thời gian', 'Số báo danh', 'Họ và tên', 'Lớp', 'Mã đề', 'Điểm P.I', 'Điểm P.II', 'Điểm P.III', 'Tổng điểm', 'Điểm tối đa']];
              view.forEach(function (r, index) {
                  const p = r.parts || ['', '', ''];
                  const info = getStudentInfo(r.sbd) || {name: '', cls: ''};
                  rows.push([
                      index + 1,
                      new Date(r.t).toLocaleString('vi-VN'), 
                      r.sbd, 
                      info.name, 
                      info.cls, 
                      r.md, 
                      p[0], p[1], p[2], 
                      r.total, 
                      r.max
                  ]);
              });
              const wb = XLSX.utils.book_new(); 
              XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "BangDiem");
              XLSX.writeFile(wb, `BangDiem_NTMIX_${Date.now()}.xlsx`);
              
              const msg = document.getElementById('resMsg'); 
              if (msg) msg.textContent = '✅ Đã tải bảng điểm Excel thành công.';
          };
      }
  }, 1000);
  
</script>
