<title>NTMIX Pro</title>
  <!-- Icon hiển thị trên màn hình chính iPhone -->
<link rel="apple-touch-icon" href="https://tungvinhloc.github.io/ntmix/logo-ntmix.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://tungvinhloc.github.io/ntmix/logo-ntmix.png">
<link rel="icon" type="image/png" href="https://tungvinhloc.github.io/ntmix/logo-ntmix.png">
<!-- Ẩn thanh công cụ Safari, chạy độc lập như App thật -->
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Đặt tên App hiển thị dưới icon -->
<meta name="apple-mobile-web-app-title" content="NTMIX Pro">
<!-- Làm trong suốt thanh trạng thái (pin, sóng) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Itim&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
/* Bố cục: một cột, thanh tab dưới cùng; nền ô li vở; điểm viết tay bằng bút đỏ. */
:root {
  --bg: #f5f6f9;
  --grid: rgba(36, 72, 168, 0.065);
  --card: #ffffff;
  --fg: #1a2033;
  --muted: #5a647a;
  --line: #d6dce8;
  --ink: #1c3f94;
  --ink-fg: #ffffff;
  --ink-soft: #e6edfb;
  --red: #c92d26;
  --red-soft: #fce8e6;
  --ok: #12794a;
  --ok-soft: #dcf2e6;
  --warn: #8f5a00;
  --warn-soft: #fcefd0;
  --f-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-hand: 'Itim', 'Be Vietnam Pro', 'Comic Sans MS', cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0e1218;
    --grid: rgba(143, 176, 255, 0.055);
    --card: #171c26;
    --fg: #e8ebf2;
    --muted: #98a2b8;
    --line: #29313f;
    --ink: #8fb0ff;
    --ink-fg: #0b1330;
    --ink-soft: #1b2a4f;
    --red: #ff7d72;
    --red-soft: #3b1b1a;
    --ok: #62d49c;
    --ok-soft: #143122;
    --warn: #f2c14e;
    --warn-soft: #36290f;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0e1218;
  --grid: rgba(143, 176, 255, 0.055);
  --card: #171c26;
  --fg: #e8ebf2;
  --muted: #98a2b8;
  --line: #29313f;
  --ink: #8fb0ff;
  --ink-fg: #0b1330;
  --ink-soft: #1b2a4f;
  --red: #ff7d72;
  --red-soft: #3b1b1a;
  --ok: #62d49c;
  --ok-soft: #143122;
  --warn: #f2c14e;
  --warn-soft: #36290f;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
html,
body {
  min-height: 100%;
}
body {
  font: 400 15px/1.5 var(--f-body);
  color: var(--fg);
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  padding-block: 14px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h2 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Đầu trang */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.brand svg {
  flex: none;
  color: var(--red);
}
.brand h1 {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.pill {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--ink-soft);
  color: var(--ink);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* Thẻ và nút */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.row > * {
  min-width: 0;
}
.lbl {
  font-size: 13px;
  color: var(--muted);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--fg);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
}
.btn:active {
  transform: translateY(1px);
}
.btn.primary {
  background: var(--ink);
  color: var(--ink-fg);
  border-color: var(--ink);
}
.btn.big {
  min-height: 56px;
  font-size: 16px;
  flex: 1 1 100%;
}
.btn.ghost {
  background: transparent;
}
.btn.danger {
  color: var(--red);
}
.btn[disabled] {
  opacity: 0.55;
  cursor: default;
}
.btn.small {
  min-height: 36px;
  padding: 0 12px;
  font-size: 13px;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.actions .btn:not(.big) {
  flex: 1 1 140px;
}
.hint {
  font-size: 13px;
  color: var(--muted);
}
.note {
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--warn-soft);
  color: var(--warn);
}
.note.err {
  background: var(--red-soft);
  color: var(--red);
}
.note b {
  font-weight: 700;
}
.tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--warn-soft);
  color: var(--warn);
}

/* Điểm viết tay */
.gradebox {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.grade { position: relative; display: inline-flex; align-items: baseline; justify-content: center; gap: 2px; padding: 18px 38px 14px; min-width: 140px; color: var(--red); font-family: var(--f-hand); line-height: 1; transform: rotate(-3deg); }
.grade .num { font-size: 52px; font-weight: bold; font-variant-numeric: tabular-nums; z-index: 2; }
.grade .of { font-size: 22px; font-weight: bold; opacity: 0.9; z-index: 2; margin-bottom: 6px; }
.grade svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: 1; }
.sum {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.sum strong {
  font-size: 17px;
  font-variant-numeric: tabular-nums;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--ink-soft);
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.chip.bad {
  background: var(--red-soft);
  color: var(--red);
}
.chip.ok {
  background: var(--ok-soft);
  color: var(--ok);
}
.chip.mid {
  background: var(--warn-soft);
  color: var(--warn);
}

/* Ô nhập */
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.field input,
.field textarea {
  min-height: 42px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  width: 100%;
}
.field textarea {
  min-height: 64px;
  resize: vertical;
  font-family: var(--f-body);
}
.mono {
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.12em;
  font-weight: 600;
}
.fields {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
}
.stepper {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.stepper button {
  width: 44px;
  height: 42px;
  border: 0;
  background: var(--bg);
  font-size: 20px;
  cursor: pointer;
}
.stepper output {
  min-width: 48px;
  text-align: center;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.seg button {
  min-height: 42px;
  padding: 0 14px;
  border: 0;
  background: var(--bg);
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
}
.seg button[aria-pressed='true'] {
  background: var(--ink);
  color: var(--ink-fg);
}
.num-in {
  width: 84px;
  min-height: 42px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  text-align: center;
  font-weight: 700;
}
input[type='range'] {
  width: 100%;
  accent-color: var(--ink);
}
.range-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.range-lbls {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}

/* Lưới đáp án */
.qgrid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  --chip: 28px;
}
.qgrid.k5 {
  --chip: 25px;
}
.q {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 6px 2px 0;
  border-radius: 8px;
  min-width: 0;
}
.q.bad {
  background: var(--red-soft);
}
.q.mid {
  background: var(--warn-soft);
}
.qn {
  width: 22px;
  text-align: right;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  flex: none;
}
.opts {
  display: flex;
  gap: 4px;
}
.o {
  width: var(--chip);
  height: var(--chip);
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--card);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  padding: 0;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.o.sel {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--ink-fg);
}
.o.sel.ok {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--card);
}
.o.sel.bad {
  background: var(--red);
  border-color: var(--red);
  color: var(--card);
}
.o.key {
  border: 2px dashed var(--ok);
  color: var(--ok);
}

.vchips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.vchip {
  min-height: 36px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
}
.vchip[aria-pressed='true'] {
  background: var(--ink);
  color: var(--ink-fg);
  border-color: var(--ink);
}

canvas.photo {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 8px;
  background: #222;
}
.sheetimg {
  display: block;
  width: 100%;
  max-width: 520px;
  height: auto;
  margin: 0 auto;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
}

/* Kết quả đã lưu */
.stats {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.stats b {
  color: var(--fg);
  font-size: 16px;
}
.hist {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 64px;
}
.hist i {
  flex: 1;
  background: var(--ink);
  border-radius: 3px 3px 0 0;
  min-height: 2px;
  opacity: 0.85;
}
.hist-ax {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.list {
  display: flex;
  flex-direction: column;
}
.item {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}
.item:first-child {
  border-top: 0;
}
.item .who {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.item .meta {
  font-size: 12px;
  color: var(--muted);
}
.item .sc {
  font-family: var(--f-hand);
  font-size: 24px;
  color: var(--red);
  font-variant-numeric: tabular-nums;
}
.item button {
  width: 36px;
  height: 36px;
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 8px;
  color: var(--muted);
  cursor: pointer;
}
.empty {
  text-align: center;
  color: var(--muted);
  padding: 18px 8px;
  font-size: 14px;
}

.spin {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 3px solid var(--ink-soft);
  border-top-color: var(--ink);
  animation: sp 0.8s linear infinite;
}
@keyframes sp {
  to {
    transform: rotate(360deg);
  }
}
.busy {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
  padding: 22px;
  color: var(--muted);
}
@media (prefers-reduced-motion: reduce) {
  .spin {
    animation-duration: 3s;
  }
  .btn:active {
    transform: none;
  }
}

/* Thanh tab dưới */
.tabs {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  display: flex;
  justify-content: center;
  background: var(--card);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px))
    max(8px, env(safe-area-inset-left, 0px));
}
.tabs > div {
  display: flex;
  width: 100%;
  max-width: 640px;
  gap: 4px;
}
.tab {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  position: relative;
}
.tab[aria-current='page'] {
  color: var(--ink);
  background: var(--ink-soft);
}
.tab svg {
  width: 22px;
  height: 22px;
}
.tab .bd {
  position: absolute;
  top: 2px;
  left: calc(50% + 6px);
  min-width: 16px;
  padding: 0 4px;
  height: 16px;
  border-radius: 8px;
  background: var(--red);
  color: var(--card);
  font-size: 10px;
  line-height: 16px;
  text-align: center;
}

/* Phiếu 3 phần */
.prow {
  display: grid;
  grid-template-columns: 1fr auto 84px;
  gap: 8px;
  align-items: center;
}
.prow.head {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}
.prow.head span:first-child {
  text-align: left;
}
.pl {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.pl small {
  color: var(--muted);
  font-size: 12px;
}
.prow .num-in {
  width: 100%;
}
.fields.one {
  grid-template-columns: 1fr;
}
.seg.full {
  display: flex;
  width: 100%;
}
.seg.full button {
  flex: 1;
}
h3.ph {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  margin: 8px 0 0;
}
.tflist {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tfq {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas: 'q t' 's s';
  gap: 4px 8px;
  padding: 6px 8px;
  border-radius: 8px;
  min-width: 0;
  align-items: center;
}
.tfq.bad {
  background: var(--red-soft);
}
.tfq.mid {
  background: var(--warn-soft);
}
.tqn {
  grid-area: q;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.sts {
  grid-area: s;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
}
.tail {
  grid-area: t;
  font-size: 13px;
}
.st {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.st i {
  font-style: normal;
  font-size: 11px;
  color: var(--muted);
  width: 10px;
  text-align: right;
}
.o.tf {
  width: 28px;
  height: 28px;
  font-size: 12px;
}
.numlist {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}
.numq {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 8px;
  align-items: center;
  padding: 6px 8px;
  border-radius: 8px;
  border: 1px solid var(--line);
  min-width: 0;
}
.numq.bad {
  background: var(--red-soft);
  border-color: transparent;
}
.numq.mid {
  background: var(--warn-soft);
  border-color: transparent;
}
.numq.good {
  background: var(--ok-soft);
  border-color: transparent;
}
.numq .tqn {
  grid-area: auto;
}
.numin {
  width: 100%;
  min-width: 0;
  min-height: 36px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--card);
  text-align: center;
}
.keyv {
  grid-column: 1 / -1;
  font-size: 12px;
  color: var(--muted);
}
.keyv b {
  color: var(--fg);
}
.item .meta {
  overflow-wrap: anywhere;
}

/* Nhập bằng mã QR */
.note.ok {
  background: var(--ok-soft);
  color: var(--ok);
}
.qrprev {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
}
.qrpaste summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--ink);
  font-weight: 600;
  padding: 6px 0;
}
.qrpaste[open] summary {
  margin-bottom: 6px;
}
.qrpaste .actions {
  margin-top: 8px;
}

/* ---- Quét trực tiếp ---- */
.live {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #000;
  color: #fff;
  display: flex;
  flex-direction: column;
}
.live[hidden] {
  display: none;
}
.live video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Chuyển chuỗi đáp án Phần III thành các ô cần tô (dùng cho ảnh mẫu). */
function numToCells(str) {
  const cells = [];
  String(str)
    .replace(/\s+/g, '')
    .split('')
    .slice(0, 4)
    .forEach(function (ch, c) {
      if (ch === '-') cells.push({ c: 0, k: '-' });
      else if (ch === ',' || ch === '.') cells.push({ c: c, k: ',' });
      else if (/\d/.test(ch)) cells.push({ c: c, k: ch });
    });
  return cells;
}
/* Tô bút lên ảnh phiếu (ctx đã scale 1 đơn vị = 1 mm). */
function drawMarks(ctx, L, marks, seed) {
  const rng = mulberry32(seed || 7);
  function pen(b) {
    ctx.fillStyle = 'rgba(24,24,40,' + (marks.alpha || 0.9) + ')';
    for (let t = 0; t < 2; t++) {
      ctx.beginPath();
      ctx.ellipse(
        b.x + (rng() - 0.5) * 0.3,
        b.y + (rng() - 0.5) * 0.3,
        RB * (marks.cover || 1) * (0.82 + rng() * 0.14),
        RB * (marks.cover || 1) * (0.82 + rng() * 0.14),
        rng() * 3,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }
  }
  L.p1.forEach(function (b) {
    if (marks.p1[b.q] && marks.p1[b.q].indexOf(b.o) >= 0) pen(b);
  });
  L.p2.forEach(function (b) {
    const v = marks.p2[b.q] && marks.p2[b.q][b.r];
    if ((v === 'D' && b.s === 0) || (v === 'S' && b.s === 1) || v === 'X') pen(b);
  });
  L.p3.forEach(function (b) {
    const cells = numToCells(marks.p3[b.q] || '');
    if (
      cells.some(function (m) {
        return m.c === b.c && m.k === b.k;
      })
    )
      pen(b);
  });
  L.sbd.forEach(function (b) {
    if (marks.sbd && marks.sbd[b.c] === String(b.d)) pen(b);
  });
  L.md.forEach(function (b) {
    if (marks.md && marks.md[b.c] === String(b.d)) pen(b);
  });
}

/* ---------- Hình học ---------- */
function solveHomography(S, D) {
  const A = [];
  for (let i = 0; i < 4; i++) {
    const x = S[i][0],
      y = S[i][1],
      u = D[i][0],
      v = D[i][1];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y, u]);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y, v]);
  }
  for (let c = 0; c < 8; c++) {
    let p = c;
    for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    if (Math.abs(A[p][c]) < 1e-12) return null;
    const tmp = A[c];
    A[c] = A[p];
    A[p] = tmp;
    for (let r = 0; r < 8; r++) {
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      for (let k = c; k < 9; k++) A[r][k] -= f * A[c][k];
    }
  }
  return A.map(function (row, i) {
    return row[8] / row[i];
  });
}
function applyH(H, x, y) {
  const d = H[6] * x + H[7] * y + 1;
  return [(H[0] * x + H[1] * y + H[2]) / d, (H[3] * x + H[4] * y + H[5]) / d];
}
function lumAt(g, w, h, u, v) {
  if (!(u >= 0 && v >= 0 && u <= w - 1 && v <= h - 1)) return NaN;
  const x0 = u | 0,
    y0 = v | 0,
    x1 = Math.min(x0 + 1, w - 1),
    y1 = Math.min(y0 + 1, h - 1);
  const fx = u - x0,
    fy = v - y0;
  const a = g[y0 * w + x0],
    b = g[y0 * w + x1],
    c = g[y1 * w + x0],
    d = g[y1 * w + x1];
  return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
}
function sampleMM(g, w, h, H, x, y) {
  const p = applyH(H, x, y);
  return lumAt(g, w, h, p[0], p[1]);
}
function bandOf(y) {

/* ---------- Tìm các ô vuông đen định vị ---------- */
/* Dùng kênh đỏ: mực in hồng của phiếu gần như biến mất, còn nét bút đen/xanh vẫn tối. */
function redOf(d, n) {
  const g = new Float32Array(n);
  for (let i = 0, p = 0; i < n; i++, p += 4) g[i] = d[p];
  return g;
}

function markGray(d, n) {
  const g = new Float32Array(n);
  for (let i = 0, p = 0; i < n; i++, p += 4) g[i] = (d[p] + d[p + 1] + d[p + 2]) / 3;
  return g;
}
/* Ảnh chụp dưới đèn ám màu (nửa xanh, nửa vàng) thì mỗi vùng chỉ rõ ở một kênh màu. Tìm ô neo trên cả kênh
   đỏ và kênh xanh dương rồi gộp lại. */
function chanOf(d, w, x0, y0, cw, ch, off) {
  const g = new Float32Array(cw * ch);
  for (let y = 0; y < ch; y++) {
    let p = ((y0 + y) * w + x0) * 4 + off;
    for (let x = 0; x < cw; x++, p += 4) g[y * cw + x] = d[p];
  }
  return g;
}
/* Danh sách ô vuông ứng viên trong vùng (x0, y0, cw, ch): tìm riêng trên kênh đỏ và kênh xanh dương rồi
   gộp, bỏ trùng. */
function findMarkers(d, w, x0, y0, cw, ch) {
  const out = [];
  [0, 2].forEach(function (off) {
    const g = chanOf(d, w, x0, y0, cw, ch, off);
    const mk = adaptiveMask(g, cw, ch);
    findBlobs(mk, cw, ch).forEach(function (px) {
      const sh = blobShape(px, cw);
      if (sh.fill < 0.68 || sh.ratio > 1.5 || sh.side < 4) return;
      /* Ô vuông neo nằm trong vùng lề trắng: vành ngay quanh nó gần như không có nét tối. Bong bóng, chữ
         in thì có. */
      let dark = 0,
        tot = 0;
      const r0 = sh.side * 0.85,
        r1 = sh.side * 1.45,
        lcx = sh.cx,
        lcy = sh.cy;
      for (let k = 0; k < 24; k++) {
        const ang = (k * Math.PI) / 12;
        for (let rr = r0; rr <= r1; rr += Math.max(1, (r1 - r0) / 3)) {
          const xx = Math.round(lcx + Math.cos(ang) * rr),
            yy = Math.round(lcy + Math.sin(ang) * rr);
          if (xx < 0 || yy < 0 || xx >= cw || yy >= ch) continue;
          tot++;
          if (mk[yy * cw + xx]) dark++;
        }
      }
      sh.iso = tot ? 1 - dark / tot : 0;
      sh.cx += x0;
      sh.cy += y0;
      for (let i = 0; i < out.length; i++)
        if (Math.hypot(out[i].cx - sh.cx, out[i].cy - sh.cy) < Math.max(out[i].side, sh.side) * 0.7) {
          if (sh.fill > out[i].fill) out[i] = sh;
          return;
        }
      out.push(sh);
    });
  });
  return out;

function adaptiveMask(g, w, h) {
  const R = Math.max(12, Math.round(Math.min(w, h) / 12));
  const W1 = w + 1,
    I = new Float64Array(W1 * (h + 1));
  for (let y = 0; y < h; y++) {
    let row = 0;
    for (let x = 0; x < w; x++) {
      row += g[y * w + x];
      I[(y + 1) * W1 + x + 1] = I[y * W1 + x + 1] + row;
    }
  }
  const m = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    const y0 = Math.max(0, y - R),
      y1 = Math.min(h, y + R + 1);
    for (let x = 0; x < w; x++) {
      const x0 = Math.max(0, x - R),
        x1 = Math.min(w, x + R + 1);
      const sum = I[y1 * W1 + x1] - I[y0 * W1 + x1] - I[y1 * W1 + x0] + I[y0 * W1 + x0];
      const mean = sum / ((x1 - x0) * (y1 - y0));
      const v = g[y * w + x];
      if (v < mean * 0.62 && mean - v > Math.max(18, Math.min(45, mean * 0.4))) m[y * w + x] = 1;
    }

    seen = new Uint8Array(N),
    stack = new Int32Array(N),

  const minA = Math.max(20, N / 60000),
    maxA = N / 100,
    out = [];
  for (let s = 0; s < N; s++) {
    if (!mask[s] || seen[s]) continue;
    let sp = 0,
      cnt = 0;
    stack[sp++] = s;
    seen[s] = 1;
    while (sp) {
      const p = stack[--sp];
      buf[cnt++] = p;
      const x = p % w,
        y = (p - x) / w;
      if (x > 0 && mask[p - 1] && !seen[p - 1]) {
        seen[p - 1] = 1;
        stack[sp++] = p - 1;
      }
      if (x < w - 1 && mask[p + 1] && !seen[p + 1]) {
        seen[p + 1] = 1;
        stack[sp++] = p + 1;
      }
      if (y > 0 && mask[p - w] && !seen[p - w]) {
        seen[p - w] = 1;
        stack[sp++] = p - w;
      }
      if (y < h - 1 && mask[p + w] && !seen[p + w]) {
        seen[p + w] = 1;
        stack[sp++] = p + w;
      }
    }
    if (cnt >= minA && cnt <= maxA) out.push(Int32Array.from(buf.subarray(0, cnt)));
  }

}
function blobShape(px, w) {

    sy = 0;
  for (let i = 0; i < n; i++) {

function analyzeImage(imgData, w, h, cfg, thr) {

    gm = markGray(imgData.data, w * h);

  const quad = pickQuad(cands, w, h, { d: imgData.data, w: w, h: h });
  if (!quad) return { error: 'quad' };
  const fit = orient(gm, w, h, quad.pts, cands);
  if (!fit) return { error: 'orient' };
  const ppm = (dist(fit.P[0], fit.P[1]) + dist(fit.P[3], fit.P[2])) / 2 / (CORNERS[1][0] - CORNERS[0][0]);
  const bands = buildBands(fit, cands, ppm, { d: imgData.data, w: w, h: h });
  const res = scanSheet(g, w, h, L, cfg, bands.H, thr, gm);
  res.L = L;
  res.HB = bands.H;
  res.P = fit.P;
  res.ppm = ppm;

  if (a.indexOf('?') >= 0 || !a || !b) return false;
  const x = parseFloat(a.replace(',', '.')),
    y = parseFloat(b.replace(',', '.'));
  return isFinite(x) && isFinite(y) && Math.abs(x - y) < 1e-9;
}
/* Đáp án có thể có nhiều lựa chọn: Phần I là số hoặc mảng số, Phần II là 'D', 'S' hoặc 'DS' (đúng sai đều
   được). */
function keyArr(x) {
  return x === null || x === undefined ? [] : Array.isArray(x) ? x : [x];
}
function tfHas(kv, v) {
  return kv !== null && kv !== undefined && typeof kv === 'string' && kv.indexOf(v) >= 0;
}
const TF_LADDER = [0, 0.1, 0.25, 0.5, 1];
function gradeAll(st, cfg, ver) {
  const out = {
    p1: { ok: 0, wrong: 0, blank: 0, multi: 0, st: [], pts: 0, max: 0 },
    p2: { st: [], per: [], pts: 0, max: 0 },
    p3: { ok: 0, st: [], pts: 0, max: 0 }
  };
  for (let q = 0; q < cfg.n1; q++) {
    const kq = keyArr(ver.mcq[q]),
      m = st.p1[q];
    if (!kq.length) {
      out.p1.st.push('skip');
      continue;
    }
    out.p1.max += cfg.p1;
    /* chọn cả 4 đáp án A, B, C, D = câu lỗi: ai cũng được điểm */
    if (kq.length === 4) {
      out.p1.st.push('ok');
      out.p1.ok++;
      continue;
    }
    if (m.length === 0) {
      out.p1.st.push('blank');
      out.p1.blank++;
    } else if (m.length > 1) {
      out.p1.st.push('multi');
      out.p1.multi++;
    } else if (kq.indexOf(m[0]) >= 0) {
      out.p1.st.push('ok');
      out.p1.ok++;
    } else {
      out.p1.st.push('wrong');
      out.p1.wrong++;
    }
  }
  out.p1.pts = out.p1.ok * cfg.p1;
  for (let q = 0; q < cfg.n2; q++) {
    const kk = ver.tf[q] || [null, null, null, null],
      items = [];
    let cnt = 0,
      graded = 0;
    for (let r = 0; r < 4; r++) {
      const kv = kk[r],
        sv = st.p2[q][r];
      if (kv === null || kv === undefined) {
        items.push('skip');
        continue;
      }
      graded++;
      if (sv && sv !== 'X' && tfHas(kv, sv)) {
        cnt++;
        items.push('ok');
      } else items.push(sv === '' ? 'blank' : 'wrong');
    }
    const frac = graded === 4 ? TF_LADDER[cnt] : graded ? cnt / graded : 0;
    out.p2.per.push({ cnt: cnt, graded: graded, items: items, pts: frac * cfg.p2 });
    out.p2.st.push(graded ? (cnt === graded ? 'ok' : cnt === 0 ? 'wrong' : 'part') : 'skip');
    if (graded) out.p2.max += cfg.p2;
    out.p2.pts += frac * cfg.p2;
  }
  for (let q = 0; q < cfg.n3; q++) {
    const kq = ver.num[q],
      s = st.p3[q];
    if (!kq) {
      out.p3.st.push('skip');
      continue;
    }
    out.p3.max += cfg.p3;
    if (kq === '*') {
      out.p3.st.push('ok');
      out.p3.ok++;
      out.p3.pts += cfg.p3;
      continue;
    } /* câu lỗi đề: ai cũng được điểm */
    if (!s) out.p3.st.push('blank');
    else if (numEq(s, kq)) {
      out.p3.st.push('ok');
      out.p3.ok++;
      out.p3.pts += cfg.p3;
    } else out.p3.st.push('wrong');
  }
  out.total = out.p1.pts + out.p2.pts + out.p3.pts;
  out.max = out.p1.max + out.p2.max + out.p3.max;
  return out;
}

/* ---------- Quét trực tiếp: chỉ tìm 4 ô neo + hướng phiếu, đủ nhẹ để chạy mỗi khung hình ---------- */
function detectFrame(imgData, w, h) {
  const g = markGray(imgData.data, w * h);
  const cands = findMarkers(imgData.data, w, 0, 0, w, h);
  if (cands.length < 4) return { found: 0, cands: cands };
  const quad = pickQuad(cands, w, h, null, true);
  if (!quad) return { found: 0, cands: cands };
  const fit = orient(g, w, h, quad.pts);
  let area = 0;
  for (let i = 0; i < 4; i++) {
    const p = quad.pts[i],
      q = quad.pts[(i + 1) % 4];
    area += p[0] * q[1] - q[0] * p[1];
  }
  area = Math.abs(area) / 2;
  let side = 0;
  quad.pts.forEach(function (p) {
    let best = null;
    cands.forEach(function (c) {
      const d = Math.hypot(c.cx - p[0], c.cy - p[1]);
      if (!best || d < best.d) best = { d: d, s: c.side };
    });
    side += best ? best.s : 6;
  });
  return {
    found: fit ? 2 : 1,
    pts: fit ? fit.P : quad.pts,
    side: side / 4,
    areaFrac: area / (w * h),
    cands: cands
  };
}

/* ---------- Quét trực tiếp, bản nhanh: chỉ tìm ô vuông trong 4 ô cửa sổ ở bốn góc khung ---------- */
/* wins: 4 hình chữ nhật [x0, y0, x1, y1] theo thứ tự góc trên trái, trên phải, dưới phải, dưới trái. */
function detectCorners(imgData, w, h, wins) {
  const g = markGray(imgData.data, w * h),
    pts = [],
    sides = [];
  for (let k = 0; k < 4; k++) {
    const x0 = Math.max(0, Math.floor(wins[k][0])),
      y0 = Math.max(0, Math.floor(wins[k][1]));
    const x1 = Math.min(w, Math.ceil(wins[k][2])),
      y1 = Math.min(h, Math.ceil(wins[k][3]));
    const cw = x1 - x0,
      ch = y1 - y0;
    if (cw < 16 || ch < 16) return { found: 0, miss: k };
    let best = null;
    findMarkers(imgData.data, w, x0, y0, cw, ch).forEach(function (sh) {
      if (!best || sh.n > best.n) best = sh;
    });
    if (!best) return { found: 0, miss: k };
    pts.push([best.cx, best.cy]);
    sides.push(best.side);
  }
  let area = 0;
  for (let i = 0; i < 4; i++) {
    const p = pts[i],
      q = pts[(i + 1) % 4];
    area += p[0] * q[1] - q[0] * p[1];
  }
  area = Math.abs(area) / 2;
  const fit = orient(g, w, h, pts);
  return {
    found: fit ? 2 : 1,
    pts: fit ? fit.P : pts,
    side: (sides[0] + sides[1] + sides[2] + sides[3]) / 4,
    areaFrac: area / (w * h)
  };
}

/* Tạo ảnh chụp giả lập từ chính ảnh phiếu: tô đáp án, chụp nghiêng, lệch sáng, nhiễu. */
function renderPhoto(sheetImg, cfg, marks, o) {
  o = o || {};
  const L = makeLayout(cfg),
    ppm = o.ppm || 6,
    rng = mulberry32((o.seed || 11) + 100);
  const paper = document.createElement('canvas');
  paper.width = Math.round(PW * ppm);
  paper.height = Math.round(PH * ppm);
  const pc = paper.getContext('2d');
  pc.drawImage(sheetImg, 0, 0, paper.width, paper.height);
  pc.setTransform(ppm, 0, 0, ppm, 0, 0);
  if (!o.noMarks) drawMarks(pc, L, marks, o.seed || 11);
  const pd = pc.getImageData(0, 0, paper.width, paper.height).data,
    PWpx = paper.width,
    PHpx = paper.height;
  const DW = o.w || 1200,
    DH = o.h || 1650;
  const dq = o.quad || [
    [130, 150],
    [1090, 95],
    [1150, 1560],
    [70, 1500]
  ];
  const Hi = solveHomography(dq, [
    [0, 0],
    [PW, 0],
    [PW, PH],
    [0, PH]
  ]);
  const out = document.createElement('canvas');
  out.width = DW;
  out.height = DH;
  const oc = out.getContext('2d'),
    img = oc.createImageData(DW, DH),
    od = img.data;
  const light = o.light === undefined ? 0.25 : o.light,
    noise = o.noise === undefined ? 10 : o.noise;
  for (let v = 0; v < DH; v++) {
    for (let u = 0; u < DW; u++) {
      const d = Hi[6] * u + Hi[7] * v + 1;
      const x = (Hi[0] * u + Hi[1] * v + Hi[2]) / d,
        y = (Hi[3] * u + Hi[4] * v + Hi[5]) / d;
      const p = (v * DW + u) * 4;
      let r, g, b;
      if (x >= 0 && y >= 0 && x <= PW && y <= PH) {
        const fx = Math.min(x * ppm, PWpx - 1.001),
          fy = Math.min(y * ppm, PHpx - 1.001);
        const x0 = fx | 0,
          y0 = fy | 0,
          tx = fx - x0,
          ty = fy - y0,
          i00 = (y0 * PWpx + x0) * 4,
          i01 = i00 + 4,
          i10 = i00 + PWpx * 4,
          i11 = i10 + 4;
        r = (pd[i00] * (1 - tx) + pd[i01] * tx) * (1 - ty) + (pd[i10] * (1 - tx) + pd[i11] * tx) * ty;
        g =
          (pd[i00 + 1] * (1 - tx) + pd[i01 + 1] * tx) * (1 - ty) +
          (pd[i10 + 1] * (1 - tx) + pd[i11 + 1] * tx) * ty;
        b =
          (pd[i00 + 2] * (1 - tx) + pd[i01 + 2] * tx) * (1 - ty) +
          (pd[i10 + 2] * (1 - tx) + pd[i11 + 2] * tx) * ty;
        r *= 0.97;
        g *= 0.97;
        b *= 0.94;
      } else {
        const s = 0.88 + 0.12 * Math.sin(v / 9 + u / 210);
        r = 96 * s;
        g = 74 * s;
        b = 58 * s;
      }
      const lf = 1 - light * ((u / DW) * 0.5 + (v / DH) * 0.5),
        nz = (rng() - 0.5) * noise;
      od[p] = r * lf + nz;
      od[p + 1] = g * lf + nz;
      od[p + 2] = b * lf + nz;
      od[p + 3] = 255;
    }
  }
  oc.putImageData(img, 0, 0);
  if (o.blur) {
    const c2 = document.createElement('canvas');
    c2.width = DW;
    c2.height = DH;
    const x2 = c2.getContext('2d');
    x2.filter = 'blur(' + o.blur + 'px)';
    x2.drawImage(out, 0, 0);
    return c2;
  }
  return out;
}

          q +
          '" maxlength="5" inputmode="text" value="' +
          (bad ? '' : esc(ver.num[q])) +

          (bad ? 'câu lỗi' : 'vd: -1,5') +
          '"' +
          (bad ? ' disabled' : '') +
          '>' +
          '<label class="numbad"><input type="checkbox" data-bad="' +
          q +
          '"' +
          (bad ? ' checked' : '') +

      }
      grid.innerHTML =
        g +

        'học sinh phải tô trên phiếu. Câu bị lỗi đề: tích “Câu lỗi”, mọi học sinh đều được điểm ' +
        'câu đó, kể cả khi bỏ trống.</p>';
      grid.onchange = function (e) {
        const bx = e.target.closest('[data-bad]');
        if (bx) {
          ver.num[+bx.dataset.bad] = bx.checked ? '*' : '';
          saveCfg();
          renderKey();

        }
        const i = e.target.closest('.numin');
        if (!i) return;
        ver.num[+i.dataset.q] = cleanNum(i.value);
        i.value = ver.num[+i.dataset.q];
        saveCfg();
        $('#setCount').textContent = countSet(ver);
      };
    }
    $('#pasteGo').onclick = function () {
      const s = $('#pasteIn').value;
      if (keyPart === 1) {
        (s.toUpperCase().match(/[A-D]/g) || []).slice(0, cfg.n1).forEach(function (c, i) {
          ver.mcq[i] = LET.indexOf(c);
        });
      } else if (keyPart === 2) {
        const ch = (
          s
            .replace(/[đ]/g, 'Đ')
            .toUpperCase()
            .match(/[ĐDTSF]/g) || []
        ).map(function (c) {
          return c === 'S' || c === 'F' ? 'S' : 'D';
        });

          ver.tf[Math.floor(i / 4)][i % 4] = v;

      } else {
        s.split(/[\s;|]+/)
          .filter(Boolean)

        });

      renderKey();
    };
  }
  function cleanNum(s) {

      .replace(/[−–]/g, '-')
      .replace(/\./g, ',')
      .replace(/[^0-9,\-]/g, '')
      .slice(0, 5);

  /* ---------- Tab Phiếu in ---------- */
  async function fetchBytes(url) {
    try {
      const r = await fetch(url);
      return r.ok ? new Uint8Array(await r.arrayBuffer()) : null;
    } catch (e) {
      return null;
    }
  }
  async function saveFile(name, data) {
    if (!data) return 'unavailable';
    if (!window.claude) {
      try {
        const blob = data instanceof Blob ? data : new Blob([data]),
          a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 1500);
        return 'saved';
      } catch (e) {
        return 'unavailable';
      }
    }
    let dl = null;
    try {
      dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    } catch (e) {
      dl = null;
    }
    if (!dl) return 'unavailable';
    try {
      await dl.save({ filename: name, data: data });
      return 'saved';
    } catch (e) {
      return e && e.code === 'declined' ? 'declined' : 'unavailable';
    }
  }

  function loadImgUrl(src) {

           cfg.sheet === 'bgd25' ? sheet4Ready : sheetReady; // Cập nhật dòng này

  function buildMarks(ver) {
    const rng = mulberry32(5),
      m = { p1: [], p2: [], p3: [] };
    for (let q = 0; q < cfg.n1; q++) {
      const kq = keyArr(ver.mcq[q])[0],
        right = kq === undefined ? Math.floor(rng() * 4) : kq;
      const other = function () {
        let x;
        do {
          x = Math.floor(rng() * 4);
        } while (x === right);
        return x;
      };
      if (q === 4 || q === 13) m.p1.push([other()]);
      else if (q === 9) m.p1.push([]);
      else if (q === 16) m.p1.push([right, other()]);
      else m.p1.push([right]);
    }
    for (let q = 0; q < cfg.n2; q++) {
      const flip = [[], [1], [0, 2], [0, 1, 2]][q % 4],
        row = [];
      for (let r = 0; r < 4; r++) {
        const kv = (ver.tf[q][r] || 'D').charAt(0),
          wrong = flip.indexOf(r) >= 0;
        row.push(wrong ? (kv === 'D' ? 'S' : 'D') : kv);
      }
      m.p2.push(row);
    }
    for (let q = 0; q < cfg.n3; q++) {
      const key = (ver.num[q] === '*' ? '1' : ver.num[q]) || '';
      m.p3.push(q === 2 ? '13' : q === 4 ? '' : key);
    }
    m.sbd = '24011234'.split('');
    m.md = (ver.code || '0101').padEnd(4, '0').slice(0, MD_X.length).split('');
    return m;
  }

  async function fileToCanvas(file, maxEdge) {
    let src = null,
      w = 0,
      h = 0,
      url = null;
    try {
      src = await createImageBitmap(file, { imageOrientation: 'from-image' });
      w = src.width;
      h = src.height;
    } catch (e) {
      url = URL.createObjectURL(file);
      src = await new Promise(function (res, rej) {
        const im = new Image();
        im.onload = function () {
          res(im);
        };
        im.onerror = rej;
        im.src = url;
      });
      w = src.naturalWidth;
      h = src.naturalHeight;
    }
    const k = Math.min(1, (maxEdge || 1500) / Math.max(w, h));
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * k);
    cv.height = Math.round(h * k);
    const c = cv.getContext('2d', { willReadFrequently: true });
    c.imageSmoothingQuality = 'high';
    c.drawImage(src, 0, 0, cv.width, cv.height);
    if (url) URL.revokeObjectURL(url);
    return cv;
  }

  /* ---------- Âm báo và tuỳ chọn chấm trực tiếp ---------- */
  const SND = { ctx: null, a: null, n: 0 };
  function chimeWav() {
    const sr = 22050,
      n = Math.floor(sr * 0.8),
      buf = new ArrayBuffer(44 + n * 2),
      dv = new DataView(buf);
    const w4 = function (o, t) {
      for (let i = 0; i < 4; i++) dv.setUint8(o + i, t.charCodeAt(i));
    };
    w4(0, 'RIFF');
    dv.setUint32(4, 36 + n * 2, true);
    w4(8, 'WAVE');
    w4(12, 'fmt ');
    dv.setUint32(16, 16, true);
    dv.setUint16(20, 1, true);
    dv.setUint16(22, 1, true);
    dv.setUint32(24, sr, true);
    dv.setUint32(28, sr * 2, true);
    dv.setUint16(32, 2, true);
    dv.setUint16(34, 16, true);
    w4(36, 'data');
    dv.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) {
      const t = i / sr,
        t2 = t - 0.22;
      let v = Math.sin(2 * Math.PI * 988 * t) * Math.exp(-5 * t) * Math.min(1, t * 400);
      if (t2 > 0) v += Math.sin(2 * Math.PI * 1480 * t2) * Math.exp(-4.5 * t2) * Math.min(1, t2 * 400) * 1.1;
      v = Math.max(-1, Math.min(1, v * 0.95));
      dv.setInt16(44 + i * 2, v * 32767, true);
    }
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  function sndInit() {
    try {
      if (!SND.a) {
        SND.a = new Audio(chimeWav());
        SND.a.preload = 'auto';
        SND.a.volume = 1;
      }
      /* mở khoá phát âm trong lúc bấm nút (iPhone bắt buộc) */
      SND.a.muted = true;
      const pr = SND.a.play();
      const back = function () {
        try {
          SND.a.pause();
          SND.a.currentTime = 0;
          SND.a.muted = false;
        } catch (e) {}
      };
      if (pr && pr.then)
        pr.then(back).catch(function () {
          SND.a.muted = false;
        });
      else back();
    } catch (e) {
      /* bỏ qua */
    }
    try {
      if (!SND.ctx) {
        const A = window.AudioContext || window.webkitAudioContext;
        if (A) SND.ctx = new A();

      /* bỏ qua */
    }

  function beepWeb() {
    if (!SND.ctx) return;
    const t = SND.ctx.currentTime;
    [
      [988, 0],
      [1480, 0.22]
    ].forEach(function (nt) {
      const o = SND.ctx.createOscillator(),
        g = SND.ctx.createGain();
      o.type = 'triangle';
      o.frequency.value = nt[0];
      g.gain.setValueAtTime(0.0001, t + nt[1]);
      g.gain.exponentialRampToValueAtTime(0.9, t + nt[1] + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + nt[1] + 0.4);
      o.connect(g);
      g.connect(SND.ctx.destination);
      o.start(t + nt[1]);
      o.stop(t + nt[1] + 0.45);
    });
  }

  function lvGeom(r, v) {
    const asp = (CORNERS[1][0] - CORNERS[0][0]) / (CORNERS[3][1] - CORNERS[0][1]);
    const gw = Math.min(r.width * 0.9, r.height * 0.66 * asp),
      gh = gw / asp,
      cx = r.width / 2,
      cy = r.height * 0.47;
    const x0 = cx - gw / 2,
      x1 = cx + gw / 2,
      y0 = cy - gh / 2,
      y1 = cy + gh / 2;
    const ws = Math.min(gw * 0.28, gh * 0.5, 120);
    return {
      x0: x0,
      x1: x1,
      y0: y0,
      y1: y1,
      gw: gw,
      gh: gh,
      ws: ws,
      corners: [
        [x0, y0],
        [x1, y0],
        [x1, y1],
        [x0, y1]

  }

  function lvRegion(v, maxEdge) {

      G = lvGeom(orc, v),

    const ox = (orc.width - v.videoWidth * kc) / 2,
      oy = (orc.height - v.videoHeight * kc) / 2,
      m = G.ws / 2 + 4;

      ry1 = Math.min(v.videoHeight, Math.ceil((G.y1 + m - oy) / kc));
    const rw = Math.max(16, rx1 - rx0),
      rh = Math.max(16, ry1 - ry0),
      ka = Math.min(1, maxEdge / Math.max(rw, rh));
    return {
      rx: rx0,
      ry: ry0,
      rw: rw,
      rh: rh,
      ka: ka,
      w: Math.round(rw * ka),
      h: Math.round(rh * ka),
      G: G,
      kc: kc,
      ox: ox,
      oy: oy

  function lvOverlay(pts, state, rd) {

      v = $('#lvVideo'),

      cv.width = Math.round(r.width * dpr);
      cv.height = Math.round(r.height * dpr);
    }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, r.width, r.height);
    const vw = v.videoWidth || 1,
      vh = v.videoHeight || 1,
      k = Math.max(r.width / vw, r.height / vh);
    const ox = (r.width - vw * k) / 2,
      oy = (r.height - vh * k) / 2;
    const G = lvGeom(r, v);
    /* 4 ô cửa sổ sáng ở bốn góc: chỉ tìm ô vuông định vị trong các ô này */
    c.fillStyle = pts ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.16)';
    c.strokeStyle = 'rgba(255,255,255,0.45)';
    c.lineWidth = 1.5;
    G.corners.forEach(function (q) {
      c.fillRect(q[0] - G.ws / 2, q[1] - G.ws / 2, G.ws, G.ws);
      c.strokeRect(q[0] - G.ws / 2, q[1] - G.ws / 2, G.ws, G.ws);
    });

      const L = 34;
      c.strokeStyle = '#fffc';
      c.lineWidth = 3;
      c.lineCap = 'round';
      [
        [G.x0, G.y0, 1, 1],
        [G.x1, G.y0, -1, 1],
        [G.x1, G.y1, -1, -1],
        [G.x0, G.y1, 1, -1]
      ].forEach(function (q) {
        c.beginPath();
        c.moveTo(q[0], q[1] + q[3] * L);
        c.lineTo(q[0], q[1]);
        c.lineTo(q[0] + q[2] * L, q[1]);
        c.stroke();

      return;
    }
    if (rd) {
      const sc = rd.scan,
        kk = k / rd.k;
      c.save();
      c.translate(ox + rd.rx * k, oy + rd.ry * k);
      c.scale(kk, kk);

      } catch (e) {}

        return [(p[0] * LV.sx + LV.rx) * k + ox, (p[1] * LV.sy + LV.ry) * k + oy];

    c.lineWidth = 4;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    for (let i = 0; i < 4; i++) {
      const p = P[i],
        a = P[(i + 1) % 4],
        b = P[(i + 3) % 4],
        L = Math.min(46, Math.hypot(a[0] - p[0], a[1] - p[1]) * 0.22);
      const da = [a[0] - p[0], a[1] - p[1]],

      c.lineWidth = 3;
      c.strokeRect(p[0] - sd / 2, p[1] - sd / 2, sd, sd);

  function lvTick0() {
    if (!LV.stream) return;

  /* ---------- Hiển thị kết quả chấm ---------- */
  function grade() {

  }
  function ringPtsPhoto(sc, b, f) {
    const H = hOf(sc.HB, b.y),
      pts = [];
    for (let i = 0; i < 20; i++) {
      const t = (i * Math.PI) / 10;
      pts.push(applyH(H, b.x + RB * f * Math.cos(t), b.y + RB * f * Math.sin(t)));
    }
    return pts;
  }
function paintMarks(c, sc, g, ver, lw, ringFn) {
    c.lineJoin = 'round';
    const ringPts =
      ringFn ||
      function (sc2, b, f) {
        return ringPtsPhoto(sc2, b, f);
      };
    function poly(pts, col, dash, w) {
      c.beginPath();
      pts.forEach(function (p, i) {
        if (i) c.lineTo(p[0], p[1]);
        else c.moveTo(p[0], p[1]);
      });
      c.closePath();
      c.setLineDash(dash ? [lw * 1.4, lw * 1.1] : []);
      c.strokeStyle = col;
      c.lineWidth = w || lw;
      c.stroke();
      c.setLineDash([]);
    }
    const GOOD = '#1fb86a',
      BAD = '#ff4b3e',
      NEU = '#9aa3b5',
      KEY = '#ffb300'; // Đổi màu đáp án đúng thành Vàng

    // Vẽ Phần I
    sc.L.p1.forEach(function (b) {
      const st = g.p1.st[b.q],
        isSel = sc.p1[b.q].indexOf(b.o) >= 0,
        isKey = keyArr(ver.mcq[b.q]).indexOf(b.o) >= 0;
      if (isSel) poly(ringPts(sc, b, 1.4), st === 'ok' ? GOOD : st === 'skip' ? NEU : BAD, false);
      else if (isKey && st !== 'ok') poly(ringPts(sc, b, 1.4), KEY, false, lw * 1.2); 
    });
    
    // Vẽ Phần II
    sc.L.p2.forEach(function (b) {
      const sv = sc.p2[b.q][b.r],
        kv = ver.tf[b.q][b.r],
        mine = b.s === 0 ? 'D' : 'S';
      const isSel = sv === mine || sv === 'X'; // 'X' là khi tô cả Đ và S
      if (isSel)
        poly(ringPts(sc, b, 1.4), kv === null ? NEU : tfHas(kv, mine) && sv !== 'X' ? GOOD : BAD, false);
      else if (tfHas(kv, mine) && !(sv && sv !== 'X' && tfHas(kv, sv)))
        poly(ringPts(sc, b, 1.4), KEY, false, lw * 1.2); 
    });
    
    // Vẽ Phần III
    sc.L.p3.forEach(function (b) {
      const cells = numToCells(sc.p3[b.q]),
        st = g.p3.st[b.q];
      if (
        cells.some(function (m) {
          return m.c === b.c && m.k === b.k;
        })
      )
        poly(ringPts(sc, b, 1.4), st === 'ok' ? GOOD : st === 'skip' ? NEU : BAD, false);
      else if (
        st !== 'ok' &&
        st !== 'skip' &&
        numToCells(ver.num[b.q]).some(function (m) {
          return m.c === b.c && m.k === b.k;
        })
      )
        poly(ringPts(sc, b, 1.4), KEY, false, lw * 1.2); 
    });

    // Vẽ Số báo danh & Mã đề
    sc.L.sbd.forEach(function (b) {

  /* ---------- Lưu ảnh bài đã chấm (IndexedDB, có vòng xanh/đỏ) ---------- */
  const IMG = {
    db: null,
    open: function () {
      if (IMG.db) return Promise.resolve(IMG.db);
      return new Promise(function (res, rej) {
        try {
          const rq = indexedDB.open('btpm-images', 1);
          rq.onupgradeneeded = function () {
            rq.result.createObjectStore('img');
          };
          rq.onsuccess = function () {
            IMG.db = rq.result;
            res(IMG.db);
          };
          rq.onerror = function () {
            rej(rq.error);
          };
        } catch (e) {
          rej(e);
        }
      });
    },
    tx: function (mode, fn) {
      return IMG.open().then(function (db) {
        return new Promise(function (res, rej) {
          const t = db.transaction('img', mode),
            st = t.objectStore('img'),
            r = fn(st);
          t.oncomplete = function () {
            res(r && r.result);
          };
          t.onerror = function () {
            rej(t.error);
          };
          t.onabort = function () {
            rej(t.error);
          };
        });
      });
    },
    put: function (id, blob) {
      return IMG.tx('readwrite', function (st) {
        return st.put(blob, String(id));
      });
    },
    get: function (id) {
      return IMG.tx('readonly', function (st) {
        return st.get(String(id));
      });
    },
    del: function (id) {
      return IMG.tx('readwrite', function (st) {
        return st.delete(String(id));
      }).catch(function () {});
    },
    clear: function () {
      return IMG.tx('readwrite', function (st) {
        return st.clear();
      }).catch(function () {});
    }
  };
  /* Ảnh nắn phẳng: cắt đúng vùng nhận dạng (giữa 4 ô neo, chừa lề nhỏ) và kéo về hình chữ nhật. Vòng chấm
     vẽ lại từ đáp án khi xem nên sửa bài xong ảnh cũng đổi theo. */
  function rectGeom(outW) {
    const x0 = CORNERS[0][0],
      y0 = CORNERS[0][1],
      gw = CORNERS[1][0] - x0,
      gh = CORNERS[3][1] - y0,
      M = Math.min(gw, gh) * 0.035,
      K = outW / (gw + 2 * M);
    return {
      x0: x0,
      y0: y0,
      gw: gw,
      gh: gh,
      M: M,
      K: K,
      W: Math.round((gw + 2 * M) * K),
      H: Math.round((gh + 2 * M) * K)
    };
  }
  function rectCanvas(s, outW) {
    const g = rectGeom(outW || 720),
      cv = document.createElement('canvas');
    cv.width = g.W;
    cv.height = g.H;
    const c = cv.getContext('2d'),
      ph = s.photo,
      sw = ph.width,
      sh = ph.height;
    const src = ph.getContext('2d').getImageData(0, 0, sw, sh).data,
      out = c.createImageData(g.W, g.H),
      od = out.data;
    for (let y = 0; y < g.H; y++) {
      const ly = y / g.K - g.M + g.y0,
        H = hOf(s.HB, ly);
      for (let x = 0; x < g.W; x++) {
        const lx = x / g.K - g.M + g.x0,
          d = H[6] * lx + H[7] * ly + 1,
          u = (H[0] * lx + H[1] * ly + H[2]) / d,
          v = (H[3] * lx + H[4] * ly + H[5]) / d,
          o = (y * g.W + x) * 4;
        if (u >= 0 && v >= 0 && u <= sw - 1 && v <= sh - 1) {
          const x0 = u | 0,
            y0 = v | 0,
            x1 = Math.min(x0 + 1, sw - 1),
            y1 = Math.min(y0 + 1, sh - 1),
            fx = u - x0,
            fy = v - y0;
          const i00 = (y0 * sw + x0) * 4,
            i10 = (y0 * sw + x1) * 4,
            i01 = (y1 * sw + x0) * 4,
            i11 = (y1 * sw + x1) * 4;
          for (let k = 0; k < 3; k++)
            od[o + k] =
              (src[i00 + k] * (1 - fx) + src[i10 + k] * fx) * (1 - fy) +
              (src[i01 + k] * (1 - fx) + src[i11 + k] * fx) * fy;
          od[o + 3] = 255;
        } else {
          od[o] = od[o + 1] = od[o + 2] = 235;
          od[o + 3] = 255;
        }
      }
    }
    c.putImageData(out, 0, 0);
    return cv;
  }
  /* Vẽ lại vòng đúng/sai lên ảnh nắn phẳng từ đáp án đã nhận diện. rs gồm L, p1, p2, p3, sbd, md. */
  function paintRect(cv, rs, cs, ver, sbdTxt, mdTxt) {
    const geom = rectGeom(cv.width - 0),
      c = cv.getContext('2d');
    const kx = cv.width / (geom.gw + 2 * geom.M);
    const g = gradeAll({ p1: rs.p1, p2: rs.p2, p3: rs.p3 }, cs, ver);
    const ring = function (sc2, b, f) {
      const pts = [];
      for (let i = 0; i < 20; i++) {
        const t = (i * Math.PI) / 10;
        pts.push([
          (b.x + RB * f * Math.cos(t) - geom.x0 + geom.M) * kx,
          (b.y + RB * f * Math.sin(t) - geom.y0 + geom.M) * kx
        ]);
      }
      return pts;
    };
    paintMarks(c, rs, g, ver, Math.max(1.6, RB * kx * 0.28), ring);
    return g;
  }
  /* Ảnh nhỏ vùng họ tên học sinh, cắt từ ảnh chụp theo vị trí ô tên trên phiếu */
  function nameCanvas(s) {
    const n = NAME,
      W = 360,
      k = W / n[2],
      H = Math.round(n[3] * k),
      cv = document.createElement('canvas');
    cv.width = W;
    cv.height = H;
    const c = cv.getContext('2d'),
      ph = s.photo,
      sw = ph.width,
      sh = ph.height;
    const src = ph.getContext('2d').getImageData(0, 0, sw, sh).data,
      out = c.createImageData(W, H),
      od = out.data;
    for (let y = 0; y < H; y++) {
      const ly = n[1] + y / k,
        Hm = hOf(s.HB, ly);
      for (let x = 0; x < W; x++) {
        const lx = n[0] + x / k,
          d = Hm[6] * lx + Hm[7] * ly + 1,
          u = (Hm[0] * lx + Hm[1] * ly + Hm[2]) / d,
          v = (Hm[3] * lx + Hm[4] * ly + Hm[5]) / d,
          o = (y * W + x) * 4;
        if (u >= 0 && v >= 0 && u <= sw - 1 && v <= sh - 1) {
          const x0 = u | 0,
            y0 = v | 0,
            x1 = Math.min(x0 + 1, sw - 1),
            y1 = Math.min(y0 + 1, sh - 1),
            fx = u - x0,
            fy = v - y0;
          const i00 = (y0 * sw + x0) * 4,
            i10 = (y0 * sw + x1) * 4,
            i01 = (y1 * sw + x0) * 4,
            i11 = (y1 * sw + x1) * 4;
          for (let q = 0; q < 3; q++)
            od[o + q] =
              (src[i00 + q] * (1 - fx) + src[i10 + q] * fx) * (1 - fy) +
              (src[i01 + q] * (1 - fx) + src[i11 + q] * fx) * fy;
          od[o + 3] = 255;
        } else {
          od[o] = od[o + 1] = od[o + 2] = 235;
          od[o + 3] = 255;
        }
      }
    }
    c.putImageData(out, 0, 0);
    return cv;
  }
  function withSheet(id, fn) {
    const prev = cfg.sheet;
    if (id && id !== prev) setSheet(id);
    try {
      return fn();
    } finally {
      if (id && id !== prev) setSheet(prev);
    }
  }
  /* Thêm dải thông tin phía trên ảnh (không đè lên phiếu), dùng khi lưu ảnh ra file */
  function withBanner(cvs, sbd, md, g) {
    const bh = Math.max(34, Math.round(cvs.width * 0.06)),
      out = document.createElement('canvas');
    out.width = cvs.width;
    out.height = cvs.height + bh;
    const c = out.getContext('2d');
    c.fillStyle = '#111';
    c.fillRect(0, 0, out.width, bh);
    c.drawImage(cvs, 0, bh);
    c.fillStyle = '#fff';
    c.font = '600 ' + Math.round(bh * 0.5) + 'px sans-serif';
    c.textBaseline = 'middle';
    c.fillText(
      'SBD ' + (sbd || '—') + '  ·  Mã đề ' + (md || '—') + '  ·  Điểm ' + fmt(g.total) + '/' + fmt(g.max),
      12,
      bh / 2
    );
    return out;
  }

  function storeImage(s, g) {
    try {
      const id = s.resId,
        r0 = results.find(function (x) {
          return x.id === id;
        });
      if (r0 && r0.rect) return;
      try {
        nameCanvas(s).toBlob(
          function (nb) {

              .then(function () {
                const r = results.find(function (x) {

              .catch(function () {});

          'image/jpeg',

      } catch (e2) {
        /* bỏ qua */

      if (!s.rect) s.rect = rectCanvas(s, 720);
      s.rect.toBlob(
        function (b) {
          if (!b) return;

            .then(function () {

    const e = {

    const k = s.resId

    if (k >= 0) {

  function buildPdf(pages) {
    /* pages: [{w,h,jpg:Uint8Array}] ảnh JPEG toàn trang */
    const enc = new TextEncoder(),
      chunks = [],
      offs = [];
    let len = 0;
    const put = function (x) {
      const u = typeof x === 'string' ? enc.encode(x) : x;
      chunks.push(u);
      len += u.length;
    };
    const obj = function (n, body) {
      offs[n] = len;
      put(n + ' 0 obj\n');
      if (typeof body === 'string') put(body);
      else body.forEach(put);
      put('\nendobj\n');
    };
    put('%PDF-1.4\n');
    const N = pages.length,
      kids = [];
    for (let i = 0; i < N; i++) kids.push(3 + i * 3 + ' 0 R');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + N + ' >>');
    pages.forEach(function (p, i) {
      const pn = 3 + i * 3,
        cn = pn + 1,
        im = pn + 2,
        W = 595.28,
        H = 841.89,
        cont = 'q ' + W + ' 0 0 ' + H + ' 0 0 cm /Im0 Do Q';
      obj(
        pn,
        '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' +
          W +
          ' ' +
          H +
          '] /Resources << /XObject << /Im0 ' +
          im +
          ' 0 R >> >> /Contents ' +
          cn +
          ' 0 R >>'
      );
      obj(cn, '<< /Length ' + cont.length + ' >>\nstream\n' + cont + '\nendstream');
      obj(im, [
        '<< /Type /XObject /Subtype /Image /Width ' +
          p.w +
          ' /Height ' +
          p.h +
          ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' +
          p.jpg.length +
          ' >>\nstream\n',
        p.jpg,
        '\nendstream'
      ]);
    });
    const xr = len,
      total = 3 + N * 3;
    put('xref\n0 ' + total + '\n0000000000 65535 f \n');
    for (let i = 1; i < total; i++) put(String(offs[i]).padStart(10, '0') + ' 00000 n \n');
    put('trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF');
    return new Blob(chunks, { type: 'application/pdf' });
  }

  /* ---------- Nhập đáp án bằng mã QR ---------- */
  const JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
  const ZXING_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
  const scriptLoads = {};
  function loadScript(url) {
    if (!scriptLoads[url])
      scriptLoads[url] = new Promise(function (res, rej) {
        const el = document.createElement('script');
        el.src = url;
        el.onload = function () {
          res(true);
        };
        el.onerror = function () {
          delete scriptLoads[url];
          rej(new Error('load'));
        };
        document.head.appendChild(el);
      });
    return scriptLoads[url];
  }
  function scaledCanvas(cv, k) {
    if (k === 1) return cv;
    const c = document.createElement('canvas');
    c.width = Math.max(16, Math.round(cv.width * k));
    c.height = Math.max(16, Math.round(cv.height * k));
    const x = c.getContext('2d', { willReadFrequently: true });
    x.imageSmoothingQuality = 'high';
    x.drawImage(cv, 0, 0, c.width, c.height);
    return c;
  }
  const tick = function () {
    return new Promise(function (r) {
      setTimeout(r, 0);
    });
  };
  async function decodeQrCanvas(cv) {
    if (window.BarcodeDetector) {
      try {
        const det = new window.BarcodeDetector({ formats: ['qr_code'] });
        const r = await det.detect(cv);
        if (r && r.length && r[0].rawValue) return r[0].rawValue;
      } catch (e) {
        /* thử cách khác */
      }
    }
    const scales = [1, 0.5, 0.75, 0.35, 1.5];
    try {
      await loadScript(JSQR_URL);
    } catch (e) {
      /* bỏ qua */
    }
    if (window.jsQR) {
      for (let i = 0; i < scales.length; i++) {
        if (scales[i] > 1 && Math.max(cv.width, cv.height) * scales[i] > 3200) continue;
        const c = scaledCanvas(cv, scales[i]),
          d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, c.width, c.height);
        const r = window.jsQR(d.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
        if (r && r.data) return r.data;
        await tick();
      }
    }
    try {
      await loadScript(ZXING_URL);
    } catch (e) {
      /* bỏ qua */
    }
    if (window.ZXing) {
      for (let i = 0; i < scales.length; i++) {
        if (scales[i] > 1 && Math.max(cv.width, cv.height) * scales[i] > 3200) continue;
        try {
          const c = scaledCanvas(cv, scales[i]),
            d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, c.width, c.height);
          const lum = new Uint8ClampedArray(c.width * c.height);
          for (let j = 0, p = 0; j < lum.length; j++, p += 4)
            lum[j] = (d.data[p] * 299 + d.data[p + 1] * 587 + d.data[p + 2] * 114) / 1000;
          const bmp = new window.ZXing.BinaryBitmap(
            new window.ZXing.HybridBinarizer(new window.ZXing.RGBLuminanceSource(lum, c.width, c.height))
          );
          const hints = new Map();
          hints.set(window.ZXing.DecodeHintType.TRY_HARDER, true);
          return new window.ZXing.QRCodeReader().decode(bmp, hints).getText();
        } catch (e) {
          /* thử tỉ lệ khác */
        }
        await tick();
      }
    }
    return null;
  }
  function numLike(x) {
    return typeof x === 'number' || (typeof x === 'string' && /^-?\d+([.,]\d+)?$/.test(x.trim()));
  }
  function numToKey(x) {
    const v = typeof x === 'number' ? x : parseFloat(String(x).trim().replace(',', '.'));
    if (!isFinite(v)) return '';
    let s = String(v);
    if (/e/i.test(s)) s = v.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
    return s.replace('.', ',');
  }
  /* Mỗi mã đề là một dòng: [mã đề, đáp án Phần I (A–D), đáp án Phần II (D = đúng, S = sai, mỗi câu 4 ý),
     đáp án Phần III (số)]. */
  /* Chuẩn hoá một ô trong mã QR: ô trống là '-' (không chấm), số 0 hoặc '*' là câu lỗi (ai cũng được điểm). */
  function qrTok(x) {
    if (x === null || x === undefined) return '-';
    if (x === 0 || x === '0') return '*';
    const s = String(x).trim().toUpperCase();
    if (s === '' || s === '?' || s === '-') return '-';
    return s === 'Đ' ? 'D' : s;
  }
  /* Thử xếp các đáp án vào cấu trúc của một loại phiếu: trả về { n1, n2, exact } hoặc { error }. */
  function qrStructure(P, L, N3, sheetId) {
    const mx = SHEETS[sheetId],
      pres = presetsFor(sheetId);
    if (N3 > mx.MAX3) return { error: 'toomany' };
    let fsMin = L,
      lcMax = -1;
    P.forEach(function (p) {
      p.letters.forEach(function (x, i) {
        if (x === 'S' && i < fsMin) fsMin = i;
        if (x !== 'S' && x !== 'D' && x !== '*' && x !== '-' && i > lcMax) lcMax = i;
      });
    });
    const cands = [];
    for (let n2 = 0; n2 <= mx.MAX2; n2++) {
      const n1 = L - 4 * n2;
      if (n1 < 0 || n1 > mx.MAX1 || n1 > fsMin || n1 <= lcMax) continue;
      cands.push({ n1: n1, n2: n2 });
    }
    if (!cands.length) return { error: 'structure' };
    let best = null;
    cands.forEach(function (c) {
      const isPreset = pres.some(function (p) {
        return p.n1 === c.n1 && p.n2 === c.n2 && p.n3 === N3;
      });
      const isCur = sheetId === cfg.sheet && c.n1 === cfg.n1 && c.n2 === cfg.n2 && N3 === cfg.n3;
      const sc = (isPreset ? 0 : isCur ? 100 : 200) + Math.abs(c.n2 - 4);
      if (!best || sc < best.sc) best = { n1: c.n1, n2: c.n2, sc: sc, exact: isPreset };
    });
    best.multi = cands.length > 1;
    return best;
  }
  /* Mỗi mã đề là một dòng: [mã đề, đáp án Phần I (A–D), đáp án Phần II (D = đúng, S = sai, mỗi câu 4 ý),
     đáp án Phần III (số)]. Số 0 ở Phần I, II là câu lỗi (ai cũng được điểm), ô trống là câu không chấm.
     Cấu trúc đề được suy ra từ chính mã QR; nếu loại phiếu đang chọn không chứa vừa cấu trúc đó thì
     tự chọn loại phiếu phù hợp (kết quả trả về trong sheet). */
  function parseQrKey(text) {
  let data;
  try {
    data = JSON.parse(String(text).trim());
  } catch (e) {
    return { error: 'json' };
  }
  
  let rows = [];
  
  if (data && typeof data === 'object' && !Array.isArray(data)) {
    let isTNMaker = data.success !== undefined || Object.values(data).some(function(v) { 
      return typeof v === 'string' && v.indexOf('#') > -1; 
    });

    if (isTNMaker) {
      for (let key in data) {
        if (key === 'success' || key === 'type') continue; 
        const val = data[key];
        if (typeof val === 'string' && val.indexOf('#') > -1) {
          const parts = val.split('#');
          
          // Lấy nguyên bản mã đề, không đệm thêm số 0
          let cleanKey = String(key || '').trim().replace(/\D/g, '');
          if (!cleanKey) continue;
          
          let row = [cleanKey];
          
          // Phần I: Tách lẻ từng đáp án A, B, C, D
          if (parts[0]) row = row.concat(parts[0].split(''));
          
          // Phần II: Xóa dấu _, chuyển Đ thành D, sau đó TÁCH LẺ từng ký tự để app không báo lỗi định dạng
          if (parts[1]) {
            let cleanTf = parts[1].toUpperCase().replace(/_/g, '').replace(/Đ/g, 'D').replace(/[^DS\-]/g, '');
            row = row.concat(cleanTf.split(''));
          }
          
          // Phần III: Tách lẻ các đáp án số bằng dấu _
          if (parts[2]) row = row.concat(parts[2].split('_'));
          
          rows.push(row);
        }
      }
    } else {
      rows = Object.keys(data).map(function (k) {
        let cleanKey = String(k || '').trim().replace(/\D/g, '');
        return [cleanKey].concat(Array.isArray(data[k]) ? data[k] : []);
      });
    }
  } else if (Array.isArray(data)) {
    rows = data.length && Array.isArray(data[0]) ? data : [data];
  } else {
    return { error: 'shape' };
  }

  rows = rows.filter(function (r) {
    return Array.isArray(r) && r.length > 1;
  });
  if (!rows.length) return { error: 'shape' };

  const P = [], faulty = [];
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i],
      raw = String(r[0] || '').trim().replace(/\D/g, ''),
      rest = r.slice(1);
    let j = rest.length;
    while (j > 0 && numLike(rest[j - 1])) j--;
    
    const letters = rest.slice(0, j).map(qrTok);
    // Kiểm tra định dạng: Nếu có ký tự lạ (dính chùm) sẽ báo lỗi shape
    if (letters.some(function (x) { return !/^[ABCDS*-]$/.test(x); }))
      return { error: 'shape' };
      
    letters.forEach(function (x, k) {
      if (x === '*') faulty.push({ code: raw, pos: k });
    });
    P.push({ code: raw, letters: letters, nums: rest.slice(j) });
  }

  const L = P[0].letters.length, N3 = P[0].nums.length;
  if (P.some(function (p) { return p.letters.length !== L || p.nums.length !== N3; }))
    return { error: 'inconsistent' };

  const order = [cfg.sheet].concat(['m', 'nh', 'kt', 'bgd25'].filter(function (id) { return id !== cfg.sheet; }));
  let firstErr = null;
  const fits = [];
  order.forEach(function (id) {
    const s = qrStructure(P, L, N3, id);
    if (s.error) {
      if (!firstErr) firstErr = s.error;
    } else fits.push(Object.assign(s, { sheet: id }));
  });
  if (!fits.length) return { error: firstErr || 'structure' };

  const best = fits.find(function (f) { return f.exact; }) || fits[0];
  const warnings = [];
  
  if (P.length > 20) warnings.push('Chỉ lấy 20 mã đề đầu tiên.');
  const codes = P.map(function (p) { return p.code; });
  if (codes.some(function (c, i) { return c && codes.indexOf(c) !== i; }))
    warnings.push('Có mã đề bị trùng nhau.');

  const versions = P.slice(0, 20).map(function (p) {
    const v = emptyVer(p.code);
    
    for (let i = 0; i < best.n1; i++) {
      const x = p.letters[i];
      v.mcq[i] = x === '*' ? [0, 1, 2, 3] : x === '-' ? null : LET.indexOf(x);
    }
    for (let q = 0; q < best.n2; q++)
      for (let r = 0; r < 4; r++) {
        const x = p.letters[best.n1 + q * 4 + r];
        v.tf[q][r] = x === '*' ? 'DS' : x === '-' ? null : x;
      }
    for (let q = 0; q < N3; q++) v.num[q] = numToKey(p.nums[q]);
    return v;
  });

  return {
    versions: versions,
    n1: best.n1,
    n2: best.n2,
    n3: N3,
    sheet: best.sheet,
    warnings: warnings,
    total: P.length
  };
}

let qrState = { kind: 'idle' },
    qrUndo = null;

  let qrStream = null;
  let qrScanTimer = 0;

  async function startQrLive() {
    if (!camSupported()) {
      qrState = { kind: 'error', title: 'Lỗi Camera', body: 'Trình duyệt không hỗ trợ.' };
      renderQr();
      return;
    }
    $('#qrLive').hidden = false;
    document.body.style.overflow = 'hidden';
    try {
      let st;
      try {
        st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      } catch (e1) {
        st = await navigator.mediaDevices.getUserMedia({ video: true });
      }
      qrStream = st;
      const v = $('#qrVideo');
      v.srcObject = st;
      await v.play();
      qrScanLoop();
    } catch (e) {
      stopQrLive();
      qrState = { kind: 'error', title: 'Lỗi Camera', body: 'Không mở được camera: ' + e.message };
      renderQr();
    }
  }

  function stopQrLive() {
    if (qrStream) {
      qrStream.getTracks().forEach(function (t) { t.stop(); });
      qrStream = null;
    }
    try { $('#qrVideo').srcObject = null; } catch(e){}
    $('#qrLive').hidden = true;
    document.body.style.overflow = '';
    clearTimeout(qrScanTimer);
  }

  const btnQrClose = $('#qrClose');
  if(btnQrClose) btnQrClose.addEventListener('click', stopQrLive);

  async function qrScanLoop() {
    if (!qrStream) return;
    const v = $('#qrVideo');
    if (v.readyState >= 2 && v.videoWidth) {
      const cv = document.createElement('canvas');
      cv.width = v.videoWidth;
      cv.height = v.videoHeight;
      cv.getContext('2d', { willReadFrequently: true }).drawImage(v, 0, 0, cv.width, cv.height);
      try {
        const text = await decodeQrCanvas(cv);
        if (text) {
          try { beepDone(); } catch(e){} // Kêu bíp
          stopQrLive();
          qrFromText(text, false);
          return;
        }
      } catch (e) {}
    }
    qrScanTimer = setTimeout(qrScanLoop, 400);
  }

  function renderQr() {
    const host = $('#qrCard');
    let h =

      '<label class="btn" for="qrPick">Chọn ảnh QR</label>' +

      '><summary>Hoặc dán nội dung mã QR</summary><div class="field"><textarea id="qrText" spellcheck="false" placeholder=\'[["0101","A","B",…],["0102",…]]\'></textarea></div>' +
      '<div class="actions"><button type="button" class="btn small" id="qrParse">Đọc nội ' +
      'dung</button></div></details>';
      
    if (qrState.kind === 'busy') h += '<div class="busy"><span class="spin"></span>Đang xử lý dữ liệu…</div>';
    else if (qrState.kind === 'error')
      h += '<div class="note err"><b>' + esc(qrState.title) + '</b><br>' + esc(qrState.body) + '</div>';
    else if (qrState.kind === 'preview') {
      const r = qrState.res,
        pr = presetsNow().find(function (p) {
          return p.n1 === r.n1 && p.n2 === r.n2 && p.n3 === r.n3;
        });
      h +=
        '<div class="qrprev"><div><b>Đọc được ' +
        r.total +
        ' mã đề:</b> <span class="mono">' +
        r.versions.map(function (v) { return esc(v.code || '—'); }).join(' · ') +
        '</span></div>' +
        '<div class="chips"><span class="chip">Phần I: ' + r.n1 + ' câu</span><span class="chip">Phần II: ' + r.n2 + ' câu</span><span class="chip">Phần III: ' + r.n3 + ' câu</span></div>' +
        '<p class="hint">' +
        (pr ? 'Điểm sẽ đặt theo mẫu ' + pr.n1 + ' · ' + pr.n2 + ' · ' + pr.n3 + ': ' + fmt(pr.p1) + ' điểm mỗi câu Phần I, tối đa ' + fmt(pr.p2) + ' mỗi câu Phần II, ' + fmt(pr.p3) + ' mỗi câu Phần III.'
            : 'Điểm giữ nguyên như đang đặt (' + fmt(cfg.p1) + ' · ' + fmt(cfg.p2) + ' · ' + fmt(cfg.p3) + '). Chỉnh ở mục Cấu trúc đề nếu cần.') +
        ' Các mã đề đã có được giữ lại; mã đề trùng số sẽ được cập nhật, mã mới được thêm vào.</p>' +
        r.warnings.map(function (w) { return '<div class="note">' + esc(w) + '</div>'; }).join('') +
        '<div class="actions"><button type="button" class="btn primary" id="qrApply">Dùng đáp án này</button><button type="button" class="btn ghost" id="qrCancel">Bỏ qua</button></div></div>';
    } else if (qrState.kind === 'done') {
      h +=
        '<div class="note ok"><b>' + (qrState.head || 'Thành công.') + '</b> ' + esc(qrState.text) + '</div>' +
        (qrState.warns || []).map(function (w) { return '<div class="note">' + esc(w) + '</div>'; }).join('') +
        (qrUndo ? '<div class="actions"><button type="button" class="btn small" id="qrUndoBtn">Hoàn tác</button></div>' : '');
    }
    
    host.innerHTML = h;

    const qp = $('#qrPick');
    if (qp) {
      qp.onchange = function () {
        const f = this.files && this.files[0];
        this.value = '';
        if (f) qrFromFile(f);
      };
    }

    const ql = $('#qrLiveBtn');
    if (ql) ql.onclick = startQrLive;

    const ep = $('#excelPick');
    if (ep) {
      ep.onchange = async function () {
        const f = this.files && this.files[0];
        this.value = '';
        if (!f) return;
        qrState = { kind: 'busy' };
        renderQr();
        try {
          await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
          const reader = new FileReader();
          reader.onload = function (e) {
            try {
              const data = new Uint8Array(e.target.result);
              const workbook = window.XLSX.read(data, { type: 'array' });
              
              // Đọc nguyên trạng, không dùng lệnh filter xóa ô trống làm lệch cột
              const rows = window.XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: '' });
              if (!rows || !rows.length) throw new Error("File Excel trống.");
              
              let isTNMaker = String(rows[0][0] || '').toLowerCase().trim() === 'câu';
              let formattedRows = [];

              if (isTNMaker) {
                let headerRow = rows[0];
                
                // Duyệt qua từng cột mã đề
                for (let col = 1; col < headerRow.length; col++) {
                    let rawCol = headerRow[col];
                    if (rawCol === undefined || rawCol === null || String(rawCol).trim() === '') continue;
                    
                    // Lấy mã đề nguyên bản, không đệm số 0
                    let code = String(rawCol).trim().replace(/\D/g, '');
                    if (!code) continue;
                    
                    let rowData = [code];
                    let currentPart = 1, lastQ = 0;
                    
                    for (let r = 1; r < rows.length; r++) {
                        if (!rows[r] || rows[r].length === 0) continue;
                        
                        let qNumText = String(rows[r][0] || '').trim();
                        if (qNumText === '') continue;
                        
                        let qNum = parseInt(qNumText);
                        if (isNaN(qNum)) continue;
                        
                        // Chuyển phần nếu số câu lùi về 1
                        if (qNum <= lastQ && qNum === 1) {
                            currentPart++;
                        }
                        lastQ = qNum;
                        
                        let val = String(rows[r][col] || '').trim();
                        
                        if (currentPart === 1) {
                            // Phần 1: Lấy 1 chữ cái đầu tiên
                            rowData.push(val.toUpperCase().charAt(0) || '-');
                        } else if (currentPart === 2) {
                            // Phần 2: ĐĐSĐ -> Chuyển thành D, D, S, D và chẻ nhỏ thành mảng 4 ký tự
                            let tfStr = val.toUpperCase().replace(/[Đ]/g, 'D').replace(/[^DS]/g, '');
                            tfStr = (tfStr + '----').slice(0, 4); // Ép đủ 4 ý tránh lệch cấu trúc
                            rowData = rowData.concat(tfStr.split(''));
                        } else {
                            // Phần 3: Trả lời ngắn số
                            rowData.push(val || '-');
                        }
                    }
                    formattedRows.push(rowData);
                }
              }
              qrFromText(JSON.stringify(formattedRows), false);
            } catch (err) {
              qrState = { kind: 'error', title: 'Lỗi file Excel', body: err.message || 'Không thể trích xuất dữ liệu.' };
              renderQr();
            }
          };
          reader.readAsArrayBuffer(f);
        } catch (err) {
          qrState = { kind: 'error', title: 'Lỗi mạng', body: 'Không tải được thư viện Excel.' };
          renderQr();
        }
      };
    }

    $('#qrParse').onclick = function () { qrFromText($('#qrText').value, true); };
    const ap = $('#qrApply');
    if (ap) ap.onclick = applyQr;
    const ca = $('#qrCancel');
    if (ca) ca.onclick = function () { qrState = { kind: 'idle' }; renderQr(); };
    const un = $('#qrUndoBtn');
    if (un) un.onclick = undoQr;
    $('#qrClearAll').onclick = function () {
      qrUndo = JSON.parse(JSON.stringify(cfg));
      cfg.versions = [{code: '', mcq: new Array(40).fill(null), tf: Array.from({length: 8}, function() { return new Array(4).fill(null); }), num: new Array(6).fill('')}];
      cfg.active = 0;
      qrState = { kind: 'done', head: 'Đã xoá tất cả mã đề.', text: 'Hãy nhập đáp án mới.' };
      saveCfg();
      scan = null;
      renderScan();
      renderChip();
      renderKey();
    };
  }
  const QR_ERR = {
    nocode: [
      'Không đọc được mã QR trong ảnh.',
      'Chụp gần hơn để mã chiếm gần hết khung hình, đủ sáng, giữ máy thẳng và không để mã bị ' +
        'chói. Hoặc quét bằng ứng dụng khác rồi dán nội dung vào ô bên dưới.'
    ],
    json: [

    ],
    shape: [
