<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NTMIX - v1.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Itim&display=swap">
<style>
/* Bố cục: một cột, thanh tab dưới cùng; nền ô li vở; điểm viết tay bằng bút đỏ. */
:root {
  --bg: #f5f6f9;
  --grid: rgba(36, 72, 168, 0.065);
  --card: #ffffff;
  --fg: #1a2033;
  --muted: #5a647a;
  --line: #d6dce8;
  --ink: #1c3f94;
  --ink-fg: #ffffff;
  --ink-soft: #e6edfb;
  --red: #c92d26;
  --red-soft: #fce8e6;
  --ok: #12794a;
  --ok-soft: #dcf2e6;
  --warn: #8f5a00;
  --warn-soft: #fcefd0;
  --f-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-hand: 'Itim', 'Be Vietnam Pro', 'Comic Sans MS', cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0e1218;
    --grid: rgba(143, 176, 255, 0.055);
    --card: #171c26;
    --fg: #e8ebf2;
    --muted: #98a2b8;
    --line: #29313f;
    --ink: #8fb0ff;
    --ink-fg: #0b1330;
    --ink-soft: #1b2a4f;
    --red: #ff7d72;
    --red-soft: #3b1b1a;
    --ok: #62d49c;
    --ok-soft: #143122;
    --warn: #f2c14e;
    --warn-soft: #36290f;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0e1218;
  --grid: rgba(143, 176, 255, 0.055);
  --card: #171c26;
  --fg: #e8ebf2;
  --muted: #98a2b8;
  --line: #29313f;
  --ink: #8fb0ff;
  --ink-fg: #0b1330;
  --ink-soft: #1b2a4f;
  --red: #ff7d72;
  --red-soft: #3b1b1a;
  --ok: #62d49c;
  --ok-soft: #143122;
  --warn: #f2c14e;
  --warn-soft: #36290f;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
html,
body {
  min-height: 100%;
}
body {
  font: 400 15px/1.5 var(--f-body);
  color: var(--fg);
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  padding-block: 14px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h2 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Đầu trang */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.brand svg {
  flex: none;
  color: var(--red);
}
.brand h1 {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.pill {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--ink-soft);
  color: var(--ink);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* Thẻ và nút */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.row > * {
  min-width: 0;
}
.lbl {
  font-size: 13px;
  color: var(--muted);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--fg);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
}
.btn:active {
  transform: translateY(1px);
}
.btn.primary {
  background: var(--ink);
  color: var(--ink-fg);
  border-color: var(--ink);
}
.btn.big {
  min-height: 56px;
  font-size: 16px;
  flex: 1 1 100%;
}
.btn.ghost {
  background: transparent;
}
.btn.danger {
  color: var(--red);
}
.btn[disabled] {
  opacity: 0.55;
  cursor: default;
}
.btn.small {
  min-height: 36px;
  padding: 0 12px;
  font-size: 13px;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.actions .btn:not(.big) {
  flex: 1 1 140px;
}
.hint {
  font-size: 13px;
  color: var(--muted);
}
.note {
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--warn-soft);
  color: var(--warn);
}
.note.err {
  background: var(--red-soft);
  color: var(--red);
}
.note b {
  font-weight: 700;
}
.tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--warn-soft);
  color: var(--warn);
}

/* Điểm viết tay */
.gradebox {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.grade {
  position: relative;
  display: inline-flex;
  align-items: baseline;
  gap: 2px;
  padding: 8px 22px 6px;
  color: var(--red);
  font-family: var(--f-hand);
  line-height: 1;
  transform: rotate(-3deg);
}
.grade .num {
  font-size: 60px;
  font-variant-numeric: tabular-nums;
}
.grade .of {
  font-size: 24px;
  opacity: 0.85;
}
.grade svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.sum {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.sum strong {
  font-size: 17px;
  font-variant-numeric: tabular-nums;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--ink-soft);
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.chip.bad {
  background: var(--red-soft);
  color: var(--red);
}
.chip.ok {
  background: var(--ok-soft);
  color: var(--ok);
}
.chip.mid {
  background: var(--warn-soft);
  color: var(--warn);
}

/* Ô nhập */
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.field input,
.field textarea {
  min-height: 42px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  width: 100%;
}
.field textarea {
  min-height: 64px;
  resize: vertical;
  font-family: var(--f-body);
}
.mono {
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.12em;
  font-weight: 600;
}
.fields {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
}
.stepper {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.stepper button {
  width: 44px;
  height: 42px;
  border: 0;
  background: var(--bg);
  font-size: 20px;
  cursor: pointer;
}
.stepper output {
  min-width: 48px;
  text-align: center;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.seg button {
  min-height: 42px;
  padding: 0 14px;
  border: 0;
  background: var(--bg);
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
}
.seg button[aria-pressed='true'] {
  background: var(--ink);
  color: var(--ink-fg);
}
.num-in {
  width: 84px;
  min-height: 42px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  text-align: center;
  font-weight: 700;
}
input[type='range'] {
  width: 100%;
  accent-color: var(--ink);
}
.range-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.range-lbls {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}

/* Lưới đáp án */
.qgrid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  --chip: 28px;
}
.qgrid.k5 {
  --chip: 25px;
}
.q {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 6px 2px 0;
  border-radius: 8px;
  min-width: 0;
}
.q.bad {
  background: var(--red-soft);
}
.q.mid {
  background: var(--warn-soft);
}
.qn {
  width: 22px;
  text-align: right;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  flex: none;
}
.opts {
  display: flex;
  gap: 4px;
}
.o {
  width: var(--chip);
  height: var(--chip);
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--card);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  padding: 0;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.o.sel {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--ink-fg);
}
.o.sel.ok {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--card);
}
.o.sel.bad {
  background: var(--red);
  border-color: var(--red);
  color: var(--card);
}
.o.key {
  border: 2px dashed var(--ok);
  color: var(--ok);
}

.vchips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.vchip {
  min-height: 36px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
}
.vchip[aria-pressed='true'] {
  background: var(--ink);
  color: var(--ink-fg);
  border-color: var(--ink);
}

canvas.photo {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 8px;
  background: #222;
}
.sheetimg {
  display: block;
  width: 100%;
  max-width: 520px;
  height: auto;
  margin: 0 auto;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
}

/* Kết quả đã lưu */
.stats {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.stats b {
  color: var(--fg);
  font-size: 16px;
}
.hist {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 64px;
}
.hist i {
  flex: 1;
  background: var(--ink);
  border-radius: 3px 3px 0 0;
  min-height: 2px;
  opacity: 0.85;
}
.hist-ax {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.list {
  display: flex;
  flex-direction: column;
}
.item {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}
.item:first-child {
  border-top: 0;
}
.item .who {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.item .meta {
  font-size: 12px;
  color: var(--muted);
}
.item .sc {
  font-family: var(--f-hand);
  font-size: 24px;
  color: var(--red);
  font-variant-numeric: tabular-nums;
}
.item button {
  width: 36px;
  height: 36px;
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 8px;
  color: var(--muted);
  cursor: pointer;
}
.empty {
  text-align: center;
  color: var(--muted);
  padding: 18px 8px;
  font-size: 14px;
}

.spin {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 3px solid var(--ink-soft);
  border-top-color: var(--ink);
  animation: sp 0.8s linear infinite;
}
@keyframes sp {
  to {
    transform: rotate(360deg);
  }
}
.busy {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
  padding: 22px;
  color: var(--muted);
}
@media (prefers-reduced-motion: reduce) {
  .spin {
    animation-duration: 3s;
  }
  .btn:active {
    transform: none;
  }
}

/* Thanh tab dưới */
.tabs {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  display: flex;
  justify-content: center;
  background: var(--card);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px))
    max(8px, env(safe-area-inset-left, 0px));
}
.tabs > div {
  display: flex;
  width: 100%;
  max-width: 640px;
  gap: 4px;
}
.tab {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  position: relative;
}
.tab[aria-current='page'] {
  color: var(--ink);
  background: var(--ink-soft);
}
.tab svg {
  width: 22px;
  height: 22px;
}
.tab .bd {
  position: absolute;
  top: 2px;
  left: calc(50% + 6px);
  min-width: 16px;
  padding: 0 4px;
  height: 16px;
  border-radius: 8px;
  background: var(--red);
  color: var(--card);
  font-size: 10px;
  line-height: 16px;
  text-align: center;
}

/* Phiếu 3 phần */
.prow {
  display: grid;
  grid-template-columns: 1fr auto 84px;
  gap: 8px;
  align-items: center;
}
.prow.head {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}
.prow.head span:first-child {
  text-align: left;
}
.pl {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.pl small {
  color: var(--muted);
  font-size: 12px;
}
.prow .num-in {
  width: 100%;
}
.fields.one {
  grid-template-columns: 1fr;
}
.seg.full {
  display: flex;
  width: 100%;
}
.seg.full button {
  flex: 1;
}
h3.ph {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  margin: 8px 0 0;
}
.tflist {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tfq {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas: 'q t' 's s';
  gap: 4px 8px;
  padding: 6px 8px;
  border-radius: 8px;
  min-width: 0;
  align-items: center;
}
.tfq.bad {
  background: var(--red-soft);
}
.tfq.mid {
  background: var(--warn-soft);
}
.tqn {
  grid-area: q;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.sts {
  grid-area: s;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
}
.tail {
  grid-area: t;
  font-size: 13px;
}
.st {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.st i {
  font-style: normal;
  font-size: 11px;
  color: var(--muted);
  width: 10px;
  text-align: right;
}
.o.tf {
  width: 28px;
  height: 28px;
  font-size: 12px;
}
.numlist {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}
.numq {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 8px;
  align-items: center;
  padding: 6px 8px;
  border-radius: 8px;
  border: 1px solid var(--line);
  min-width: 0;
}
.numq.bad {
  background: var(--red-soft);
  border-color: transparent;
}
.numq.mid {
  background: var(--warn-soft);
  border-color: transparent;
}
.numq.good {
  background: var(--ok-soft);
  border-color: transparent;
}
.numq .tqn {
  grid-area: auto;
}
.numin {
  width: 100%;
  min-width: 0;
  min-height: 36px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--card);
  text-align: center;
}
.keyv {
  grid-column: 1 / -1;
  font-size: 12px;
  color: var(--muted);
}
.keyv b {
  color: var(--fg);
}
.item .meta {
  overflow-wrap: anywhere;
}

/* Nhập bằng mã QR */
.note.ok {
  background: var(--ok-soft);
  color: var(--ok);
}
.qrprev {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
}
.qrpaste summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--ink);
  font-weight: 600;
  padding: 6px 0;
}
.qrpaste[open] summary {
  margin-bottom: 6px;
}
.qrpaste .actions {
  margin-top: 8px;
}

/* ---- Quét trực tiếp ---- */
.live {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #000;
  color: #fff;
  display: flex;
  flex-direction: column;
}
.live[hidden] {
  display: none;
}
.live video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}
.live canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.lv-top,
.lv-bottom {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px max(16px, env(safe-area-inset-left)) 12px max(16px, env(safe-area-inset-right));
}
.lv-top {
  padding-top: max(12px, env(safe-area-inset-top));
  background: linear-gradient(#000a, #0000);
}
.lv-bottom {
  margin-top: auto;
  flex-direction: column;
  align-items: stretch;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
  background: linear-gradient(#0000, #000b);
}
.lv-btn {
  border: 1px solid #fff6;
  background: #0008;
  color: #fff;
  border-radius: 999px;
  min-width: 44px;
  height: 44px;
  font: 600 15px/1 inherit;
  font-family: inherit;
  cursor: pointer;
  padding: 0 14px;
}
.lv-btn.wide {
  height: 48px;

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function numToCells(str) {
  const cells = [];
  String(str)
    .replace(/\s+/g, '')
    .split('')
    .slice(0, 4)
    .forEach(function (ch, c) {
      if (ch === '-') cells.push({ c: 0, k: '-' });
      else if (ch === ',' || ch === '.') cells.push({ c: c, k: ',' });
      else if (/\d/.test(ch)) cells.push({ c: c, k: ch });
    });

}

  const rng = mulberry32(seed || 7);

    ctx.fillStyle = 'rgba(24,24,40,' + (marks.alpha || 0.9) + ')';
    for (let t = 0; t < 2; t++) {
      ctx.beginPath();
      ctx.ellipse(
        b.x + (rng() - 0.5) * 0.3,
        b.y + (rng() - 0.5) * 0.3,
        RB * (marks.cover || 1) * (0.82 + rng() * 0.14),
        RB * (marks.cover || 1) * (0.82 + rng() * 0.14),
        rng() * 3,
        0,

      ctx.fill();

  }
  L.p1.forEach(function (b) {
    if (marks.p1[b.q] && marks.p1[b.q].indexOf(b.o) >= 0) pen(b);
  });
  L.p2.forEach(function (b) {
    const v = marks.p2[b.q] && marks.p2[b.q][b.r];
    if ((v === 'D' && b.s === 0) || (v === 'S' && b.s === 1) || v === 'X') pen(b);
  });
  L.p3.forEach(function (b) {
    const cells = numToCells(marks.p3[b.q] || '');
    if (
      cells.some(function (m) {
        return m.c === b.c && m.k === b.k;

      pen(b);
  });
  L.sbd.forEach(function (b) {
    if (marks.sbd && marks.sbd[b.c] === String(b.d)) pen(b);

    if (marks.md && marks.md[b.c] === String(b.d)) pen(b);
  });

function solveHomography(S, D) {

      v = D[i][1];

    A.push([0, 0, 0, x, y, 1, -v * x, -v * y, v]);

    for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    if (Math.abs(A[p][c]) < 1e-12) return null;
    const tmp = A[c];
    A[c] = A[p];
    A[p] = tmp;
    for (let r = 0; r < 8; r++) {
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      for (let k = c; k < 9; k++) A[r][k] -= f * A[c][k];

function alignBlocks(ga, w, h, L, HB) {
  const groups = {};

      const a = sampleMM(ga, w, h, H, x + rr * A[i][0], y + rr * A[i][1]),

    cy /= bs.length;

      let s = 0;
      for (let i = 0; i < bs.length; i++) {

      }
      return (
        s / bs.length - (0.02 * Math.hypot(t.dx, t.dy)) / K - 0.8 * (Math.abs(t.sx - 1) + Math.abs(t.sy - 1))

    [0.98, 1.02].forEach(function (sx) {

       hàng */

    bs.forEach(function (b) {
      (rows[Math.round(b.y * 5)] = rows[Math.round(b.y * 5)] || []).push(b);
    });

      const rb = rows[rk];
      const rs = function (dx, dy) {
        let s = 0;
        for (let i = 0; i < rb.length; i++) s += ring(rb[i], rb[i].x + dx, rb[i].y + dy);
        return s / rb.length - (0.01 * Math.hypot(dx, dy)) / K;

            bx = dx;
            by = dy;

          b.x += bx;
          b.y += by;
        });
    });
  });
}
function scanSheet(g, w, h, L, cfg, HB, thr, ga) {

    A0 = RB + 0.4 * K,
    A1 = RB + 0.7 * K;

    let v = cache.get(b);

      cache.set(b, v);
    }

  };
  /* Mức "nền": phần lớn ô trên phiếu để trống nhưng vẫn có nét in và nhiễu nên có độ tối nhất định. Lấy
     trung vị làm nền rồi trừ đi, đỡ đọc nhầm khi ảnh thiếu sáng hoặc ám màu. */
  const allB = [].concat(L.p1, L.p2, L.p3, L.sbd, L.md),
    sv = allB.map(raw).sort(function (p, q) {
      return p - q;
    });
  const base = sv.length ? Math.min(sv[Math.floor(sv.length * 0.5)], 0.25) : 0;
  /* Ô số báo danh và mã đề có in sẵn chữ số bên trong nên mỗi chữ số tối khác nhau (số 8 tối hơn số 1).
     Lấy mức tối thấp của cùng một chữ số ở các cột làm nền riêng cho chữ số đó. */
  const idB = [].concat(L.sbd, L.md),
    dBase = [];
  for (let d = 0; d < 10; d++) {
    const v = idB
      .filter(function (b) {

      })

  }

  };
  /* Mức nhiễu: trong mỗi nhóm lựa chọn (một câu Phần I, một cột Phần III, một cột số báo danh hoặc mã đề)
     chỉ tối đa một ô được tô nên ô cao thứ hai chính là nhiễu. Lấy trung vị làm sàn, ô nào không vượt rõ

    grp = {};

    seen = 0;

    p1s = [];

    p1.push([]);
    p1s.push([]);
  }
  L.p1.forEach(function (b) {
    p1s[b.q][b.o] = rd(b);
  });

  const p2 = [],
    p2s = [];
  for (let q = 0; q < cfg.n2; q++) {

      [0, 0],
      [0, 0],

      out = [];

    cells.forEach(function (b) {

    });
    for (let c = 0; c < cols; c++) {

    p2: p2,
    p3: p3,
    p1s: p1s,
    sbd: sbd,
    md: md,
    markedRatio: seen ? marked / seen : 0,

}

function analyzeImage(imgData, w, h, cfg, thr) {
  const L = makeLayout(cfg);
  const g = redOf(imgData.data, w * h),
    gm = markGray(imgData.data, w * h);
  const cands = findMarkers(imgData.data, w, 0, 0, w, h);
  if (cands.length < 4) return { error: 'markers', found: cands.length };
  const quad = pickQuad(cands, w, h, { d: imgData.data, w: w, h: h });
  if (!quad) return { error: 'quad' };
  const fit = orient(gm, w, h, quad.pts, cands);
  if (!fit) return { error: 'orient' };
  const ppm = (dist(fit.P[0], fit.P[1]) + dist(fit.P[3], fit.P[2])) / 2 / (CORNERS[1][0] - CORNERS[0][0]);
  const bands = buildBands(fit, cands, ppm, { d: imgData.data, w: w, h: h });
  const res = scanSheet(g, w, h, L, cfg, bands.H, thr, gm);
  res.L = L;
  res.HB = bands.H;
  res.P = fit.P;
  res.ppm = ppm;
  res.foundMid = bands.foundMid;
  res.anchors = bands.anchors;
  return res;
}

/* ---------- Chấm điểm ---------- */
function normNum(s) {
  return String(s).replace(/\s+/g, '').replace(/[−–]/g, '-').replace(/\./g, ',');
}
function numEq(a, b) {
  a = normNum(a);
  b = normNum(b);
  if (a === b) return true;
  if (a.indexOf('?') >= 0 || !a || !b) return false;
  const x = parseFloat(a.replace(',', '.')),
    y = parseFloat(b.replace(',', '.'));
  return isFinite(x) && isFinite(y) && Math.abs(x - y) < 1e-9;
}
/* Đáp án có thể có nhiều lựa chọn: Phần I là số hoặc mảng số, Phần II là 'D', 'S' hoặc 'DS' (đúng sai đều
   được). */
function keyArr(x) {
  return x === null || x === undefined ? [] : Array.isArray(x) ? x : [x];
}
function tfHas(kv, v) {
  return kv !== null && kv !== undefined && typeof kv === 'string' && kv.indexOf(v) >= 0;
}
const TF_LADDER = [0, 0.1, 0.25, 0.5, 1];
function gradeAll(st, cfg, ver) {
  const out = {
    p1: { ok: 0, wrong: 0, blank: 0, multi: 0, st: [], pts: 0, max: 0 },
    p2: { st: [], per: [], pts: 0, max: 0 },
    p3: { ok: 0, st: [], pts: 0, max: 0 }
  };
  for (let q = 0; q < cfg.n1; q++) {
    const kq = keyArr(ver.mcq[q]),
      m = st.p1[q];
    if (!kq.length) {
      out.p1.st.push('skip');
      continue;
    }
    out.p1.max += cfg.p1;
    /* chọn cả 4 đáp án A, B, C, D = câu lỗi: ai cũng được điểm */
    if (kq.length === 4) {
      out.p1.st.push('ok');
      out.p1.ok++;
      continue;
    }
    if (m.length === 0) {
      out.p1.st.push('blank');
      out.p1.blank++;
    } else if (m.length > 1) {
      out.p1.st.push('multi');
      out.p1.multi++;
    } else if (kq.indexOf(m[0]) >= 0) {
      out.p1.st.push('ok');
      out.p1.ok++;
    } else {
      out.p1.st.push('wrong');
      out.p1.wrong++;
    }
  }
  out.p1.pts = out.p1.ok * cfg.p1;
  for (let q = 0; q < cfg.n2; q++) {
    const kk = ver.tf[q] || [null, null, null, null],
      items = [];
    let cnt = 0,
      graded = 0;
    for (let r = 0; r < 4; r++) {
      const kv = kk[r],
        sv = st.p2[q][r];
      if (kv === null || kv === undefined) {
        items.push('skip');
        continue;
      }
      graded++;
      if (sv && sv !== 'X' && tfHas(kv, sv)) {
        cnt++;
        items.push('ok');
      } else items.push(sv === '' ? 'blank' : 'wrong');
    }
    const frac = graded === 4 ? TF_LADDER[cnt] : graded ? cnt / graded : 0;
    out.p2.per.push({ cnt: cnt, graded: graded, items: items, pts: frac * cfg.p2 });
    out.p2.st.push(graded ? (cnt === graded ? 'ok' : cnt === 0 ? 'wrong' : 'part') : 'skip');
    if (graded) out.p2.max += cfg.p2;
    out.p2.pts += frac * cfg.p2;
  }
  for (let q = 0; q < cfg.n3; q++) {
    const kq = ver.num[q],
      s = st.p3[q];
    if (!kq) {
      out.p3.st.push('skip');
      continue;
    }
    out.p3.max += cfg.p3;
    if (kq === '*') {
      out.p3.st.push('ok');
      out.p3.ok++;
      out.p3.pts += cfg.p3;
      continue;
    } /* câu lỗi đề: ai cũng được điểm */
    if (!s) out.p3.st.push('blank');
    else if (numEq(s, kq)) {
      out.p3.st.push('ok');
      out.p3.ok++;
      out.p3.pts += cfg.p3;
    } else out.p3.st.push('wrong');
  }
  out.total = out.p1.pts + out.p2.pts + out.p3.pts;
  out.max = out.p1.max + out.p2.max + out.p3.max;
  return out;
}

/* ---------- Quét trực tiếp: chỉ tìm 4 ô neo + hướng phiếu, đủ nhẹ để chạy mỗi khung hình ---------- */
function detectFrame(imgData, w, h) {
  const g = markGray(imgData.data, w * h);
  const cands = findMarkers(imgData.data, w, 0, 0, w, h);
  if (cands.length < 4) return { found: 0, cands: cands };
  const quad = pickQuad(cands, w, h, null, true);
  if (!quad) return { found: 0, cands: cands };
  const fit = orient(g, w, h, quad.pts);
  let area = 0;
  for (let i = 0; i < 4; i++) {
    const p = quad.pts[i],
      q = quad.pts[(i + 1) % 4];
    area += p[0] * q[1] - q[0] * p[1];
  }
  area = Math.abs(area) / 2;
  let side = 0;
  quad.pts.forEach(function (p) {
    let best = null;
    cands.forEach(function (c) {
      const d = Math.hypot(c.cx - p[0], c.cy - p[1]);
      if (!best || d < best.d) best = { d: d, s: c.side };
    });
    side += best ? best.s : 6;
  });
  return {
    found: fit ? 2 : 1,
    pts: fit ? fit.P : quad.pts,
    side: side / 4,
    areaFrac: area / (w * h),
    cands: cands
  };
}

/* ---------- Quét trực tiếp, bản nhanh: chỉ tìm ô vuông trong 4 ô cửa sổ ở bốn góc khung ---------- */
/* wins: 4 hình chữ nhật [x0, y0, x1, y1] theo thứ tự góc trên trái, trên phải, dưới phải, dưới trái. */
function detectCorners(imgData, w, h, wins) {
  const g = markGray(imgData.data, w * h),
    pts = [],
    sides = [];
  for (let k = 0; k < 4; k++) {
    const x0 = Math.max(0, Math.floor(wins[k][0])),
      y0 = Math.max(0, Math.floor(wins[k][1]));
    const x1 = Math.min(w, Math.ceil(wins[k][2])),
      y1 = Math.min(h, Math.ceil(wins[k][3]));
    const cw = x1 - x0,
      ch = y1 - y0;
    if (cw < 16 || ch < 16) return { found: 0, miss: k };
    let best = null;
    findMarkers(imgData.data, w, x0, y0, cw, ch).forEach(function (sh) {
      if (!best || sh.n > best.n) best = sh;
    });
    if (!best) return { found: 0, miss: k };
    pts.push([best.cx, best.cy]);
    sides.push(best.side);
  }
  let area = 0;
  for (let i = 0; i < 4; i++) {
    const p = pts[i],
      q = pts[(i + 1) % 4];
    area += p[0] * q[1] - q[0] * p[1];
  }
  area = Math.abs(area) / 2;
  const fit = orient(g, w, h, pts);
  return {
    found: fit ? 2 : 1,
    pts: fit ? fit.P : pts,
    side: (sides[0] + sides[1] + sides[2] + sides[3]) / 4,
    areaFrac: area / (w * h)
  };
}

/* Tạo ảnh chụp giả lập từ chính ảnh phiếu: tô đáp án, chụp nghiêng, lệch sáng, nhiễu. */
function renderPhoto(sheetImg, cfg, marks, o) {
  o = o || {};
  const L = makeLayout(cfg),
    ppm = o.ppm || 6,
    rng = mulberry32((o.seed || 11) + 100);
  const paper = document.createElement('canvas');
  paper.width = Math.round(PW * ppm);
  paper.height = Math.round(PH * ppm);
  const pc = paper.getContext('2d');
  pc.drawImage(sheetImg, 0, 0, paper.width, paper.height);
  pc.setTransform(ppm, 0, 0, ppm, 0, 0);
  if (!o.noMarks) drawMarks(pc, L, marks, o.seed || 11);
  const pd = pc.getImageData(0, 0, paper.width, paper.height).data,
    PWpx = paper.width,
    PHpx = paper.height;
  const DW = o.w || 1200,
    DH = o.h || 1650;
  const dq = o.quad || [
    [130, 150],
    [1090, 95],
    [1150, 1560],
    [70, 1500]
  ];
  const Hi = solveHomography(dq, [
    [0, 0],
    [PW, 0],
    [PW, PH],
    [0, PH]
  ]);
  const out = document.createElement('canvas');
  out.width = DW;
  out.height = DH;
  const oc = out.getContext('2d'),
    img = oc.createImageData(DW, DH),
    od = img.data;
  const light = o.light === undefined ? 0.25 : o.light,
    noise = o.noise === undefined ? 10 : o.noise;
  for (let v = 0; v < DH; v++) {
    for (let u = 0; u < DW; u++) {
      const d = Hi[6] * u + Hi[7] * v + 1;
      const x = (Hi[0] * u + Hi[1] * v + Hi[2]) / d,
        y = (Hi[3] * u + Hi[4] * v + Hi[5]) / d;
      const p = (v * DW + u) * 4;
      let r, g, b;
      if (x >= 0 && y >= 0 && x <= PW && y <= PH) {
        const fx = Math.min(x * ppm, PWpx - 1.001),
          fy = Math.min(y * ppm, PHpx - 1.001);
        const x0 = fx | 0,
          y0 = fy | 0,
          tx = fx - x0,
          ty = fy - y0,
          i00 = (y0 * PWpx + x0) * 4,
          i01 = i00 + 4,
          i10 = i00 + PWpx * 4,
          i11 = i10 + 4;
        r = (pd[i00] * (1 - tx) + pd[i01] * tx) * (1 - ty) + (pd[i10] * (1 - tx) + pd[i11] * tx) * ty;
        g =
          (pd[i00 + 1] * (1 - tx) + pd[i01 + 1] * tx) * (1 - ty) +
          (pd[i10 + 1] * (1 - tx) + pd[i11 + 1] * tx) * ty;
        b =
          (pd[i00 + 2] * (1 - tx) + pd[i01 + 2] * tx) * (1 - ty) +
          (pd[i10 + 2] * (1 - tx) + pd[i11 + 2] * tx) * ty;
        r *= 0.97;
        g *= 0.97;
        b *= 0.94;
      } else {
        const s = 0.88 + 0.12 * Math.sin(v / 9 + u / 210);
        r = 96 * s;
        g = 74 * s;
        b = 58 * s;
      }
      const lf = 1 - light * ((u / DW) * 0.5 + (v / DH) * 0.5),
        nz = (rng() - 0.5) * noise;
      od[p] = r * lf + nz;
      od[p + 1] = g * lf + nz;
      od[p + 2] = b * lf + nz;
      od[p + 3] = 255;
    }
  }
  oc.putImageData(img, 0, 0);
  if (o.blur) {
    const c2 = document.createElement('canvas');
    c2.width = DW;
    c2.height = DH;
    const x2 = c2.getContext('2d');
    x2.filter = 'blur(' + o.blur + 'px)';
    x2.drawImage(out, 0, 0);
    return c2;
  }
  return out;
}

  async function fetchBytes(url) {

  async function saveFile(name, data) {
    if (!data) return 'unavailable';
    if (!window.claude) {
      try {
        const blob = data instanceof Blob ? data : new Blob([data]),
          a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 1500);
        return 'saved';
      } catch (e) {
        return 'unavailable';
      }
    }
    let dl = null;
    try {
      dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    } catch (e) {
      dl = null;
    }
    if (!dl) return 'unavailable';
    try {
      await dl.save({ filename: name, data: data });
      return 'saved';
    } catch (e) {
      saveFile.err = (e && (e.code || e.message)) || 'lỗi không rõ';
      return e && e.code === 'declined' ? 'declined' : 'unavailable';
    }
  }

  /* ---------- Ảnh mẫu ---------- */
  /* Ảnh phiếu nằm ở file riêng: nạp qua fetch thành blob để vẽ lên canvas và đọc điểm ảnh được (không bị chặn
     do khác nguồn). Nếu fetch không dùng được thì nạp thẳng bằng đường dẫn. */
  function loadImgUrl(src) {
    return new Promise(function (res) {
      const im = new Image();
      im.onload = function () {
        res(im);
      };
      im.onerror = function () {
        res(null);
      };
      im.src = src;
    });
  }
  async function loadImg(src) {
    try {
      const r = await fetch(src);
      if (r.ok) {
        const im = await loadImgUrl(URL.createObjectURL(await r.blob()));
        if (im) return im;
      }
    } catch (e) {
      /* dùng cách nạp thẳng */
    }
    return loadImgUrl(src);
  }
  const sheetReady = loadImg(SHEET_JPG),
    sheet2Ready = loadImg(SHEET2_JPG),
    sheet3Ready = loadImg(SHEET3_JPG);
  const curSheetImg = function () {
    return cfg.sheet === 'kt' ? sheet2Ready : cfg.sheet === 'm' ? sheet3Ready : sheetReady;
  };
  function buildMarks(ver) {
    const rng = mulberry32(5),
      m = { p1: [], p2: [], p3: [] };
    for (let q = 0; q < cfg.n1; q++) {
      const kq = keyArr(ver.mcq[q])[0],
        right = kq === undefined ? Math.floor(rng() * 4) : kq;
      const other = function () {
        let x;
        do {
          x = Math.floor(rng() * 4);
        } while (x === right);
        return x;
      };
      if (q === 4 || q === 13) m.p1.push([other()]);
      else if (q === 9) m.p1.push([]);
      else if (q === 16) m.p1.push([right, other()]);
      else m.p1.push([right]);
    }
    for (let q = 0; q < cfg.n2; q++) {
      const flip = [[], [1], [0, 2], [0, 1, 2]][q % 4],
        row = [];
      for (let r = 0; r < 4; r++) {
        const kv = (ver.tf[q][r] || 'D').charAt(0),
          wrong = flip.indexOf(r) >= 0;
        row.push(wrong ? (kv === 'D' ? 'S' : 'D') : kv);
      }
      m.p2.push(row);
    }
    for (let q = 0; q < cfg.n3; q++) {
      const key = (ver.num[q] === '*' ? '1' : ver.num[q]) || '';
      m.p3.push(q === 2 ? '13' : q === 4 ? '' : key);
    }
    m.sbd = '24011234'.split('');
    m.md = (ver.code || '0101').padEnd(4, '0').slice(0, MD_X.length).split('');
    return m;
  }

  /* ---------- Nạp ảnh ---------- */
  async function fileToCanvas(file, maxEdge) {
    let src = null,
      w = 0,
      h = 0,
      url = null;
    try {
      src = await createImageBitmap(file, { imageOrientation: 'from-image' });
      w = src.width;
      h = src.height;
    } catch (e) {
      url = URL.createObjectURL(file);
      src = await new Promise(function (res, rej) {
        const im = new Image();
        im.onload = function () {
          res(im);
        };
        im.onerror = rej;
        im.src = url;
      });
      w = src.naturalWidth;
      h = src.naturalHeight;
    }
    const k = Math.min(1, (maxEdge || 1500) / Math.max(w, h));
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * k);
    cv.height = Math.round(h * k);
    const c = cv.getContext('2d', { willReadFrequently: true });
    c.imageSmoothingQuality = 'high';
    c.drawImage(src, 0, 0, cv.width, cv.height);
    if (url) URL.revokeObjectURL(url);
    return cv;
  }
  function nextFrame() {
    return new Promise(function (r) {
      setTimeout(r, 40);
    });
  }
  async function runPhoto(getCanvas, source) {
    $('#scanOut').innerHTML =
      '<div class="card" style="margin-top:14px"><div class="busy"><span class="spin"></span>Đang ' +
      'đọc phiếu…</div></div>';
    await nextFrame();
    try {
      const cv = await getCanvas();
      analyze(cv, source);
    } catch (e) {
      scan = { error: 'load', source: source };
      renderScan();
    }
  }
  function buildScan(cv, source) {
    const c = cv.getContext('2d', { willReadFrequently: true });
    const id = c.getImageData(0, 0, cv.width, cv.height);
    const r = analyzeImage(id, cv.width, cv.height, cfg, cfg.thr);
    if (r.error) return { error: r.error, source: source, photo: cv };
    const s = r;
    s.photo = cv;
    s.source = source;
    s.saved = false;
    s.sbdStr = r.sbd.join('');
    s.mdStr = r.md.join('');
    pickVersionFor(s);
    return s;
  }
  function analyze(cv, source) {
    scan = buildScan(cv, source);
    renderScan();
  }
  function reanalyze() {
    if (scan && scan.photo) analyze(scan.photo, scan.source);
  }
  function pickVersionFor(s) {
    const nz = function (c) {
      return String(c).replace(/^0+(?=\d)/, '');
    };
    const i = cfg.versions.findIndex(function (v) {
      return v.code && nz(v.code) === nz(s.mdStr);
    });
    if (i >= 0) {
      s.ver = i;
      s.matched = true;
    } else {
      s.ver = Math.min(cfg.active, cfg.versions.length - 1);
      s.matched = false;
    }
  }
  function pickVersion() {
    pickVersionFor(scan);
  }

  /* Chấm một lần nhiều ảnh: mỗi ảnh chấm xong tự lưu vào Kết quả */
  async function runBatch(files) {
    const rows = [],
      out = $('#scanOut');
    let okN = 0;
    scan = null;
    for (let i = 0; i < files.length; i++) {
      out.innerHTML =
        '<div class="card" style="margin-top:14px"><div class="busy"><span class="spin"></span>Đang chấm ảnh ' +
        (i + 1) +

        files.length +
        '…</div></div>';
      await nextFrame();
      try {
        const cv = await fileToCanvas(files[i]),
          s = buildScan(cv, 'camera');
        if (s.error) {
          rows.push({ name: files[i].name, err: true });
          continue;
        }
        s.source = 'camera';
        const g = pushResult(s);
        okN++;
        rows.push({
          name: files[i].name,
          sbd: s.sbdStr,
          md: s.mdStr,
          matched: s.matched,
          total: g.total,
          max: g.max,
          bad: (s.sbdStr + s.mdStr).indexOf('?') >= 0
        });
      } catch (e) {
        rows.push({ name: files[i].name, err: true });
      }
    }

      '<div class="card" style="margin-top:14px"><div class="row"><h2>Đã chấm ' +

    out.innerHTML =

  }
